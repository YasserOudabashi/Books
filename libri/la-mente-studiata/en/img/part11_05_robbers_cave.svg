<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="475" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Summer camp in three phases</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">22 boys aged eleven and twelve, two groups</text><rect x="40" y="150" width="240" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/><text x="160.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">1. Formation</text><text x="160.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">two separate groups,</text>
<text x="160" y="262" text-anchor="middle" font-size="12" fill="#334155">unaware of each other</text><rect x="330" y="150" width="240" height="150" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/><text x="450.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">2. Competition</text><text x="450.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">team games and prizes,</text>
<text x="450" y="262" text-anchor="middle" font-size="12" fill="#334155">intergroup hostility</text><rect x="620" y="150" width="240" height="150" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/><text x="740.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">3. Integration</text><text x="740.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">contact alone: not enough;</text>
<text x="740" y="262" text-anchor="middle" font-size="12" fill="#334155">superordinate goals: yes</text><line x1="280" y1="225" x2="330" y2="225" stroke="#334155" stroke-width="2.5"/>
<line x1="570" y1="225" x2="620" y2="225" stroke="#334155" stroke-width="2.5"/>
<text x="450" y="350" text-anchor="middle" font-size="13" fill="#334155">About 93% of reported friendships were within the own group during competition.</text><text x="450" y="390" text-anchor="middle" font-size="12" fill="#334155">Limits: small, homogeneous sample, experimenters present in the camp,</text><text x="450" y="408" text-anchor="middle" font-size="12" fill="#334155">earlier failed attempts; the Beirut replication saw conflict among new groups.</text><text x="450" y="450" text-anchor="middle" font-size="11" fill="#64748B">Sherif et al. (1954).</text>
</svg>
