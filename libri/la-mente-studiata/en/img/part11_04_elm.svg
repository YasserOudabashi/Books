<svg xmlns="http://www.w3.org/2000/svg" width="900" height="525" viewBox="0 0 900 525" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="525" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The elaboration likelihood model</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Two routes by which a message can change an attitude</text><rect x="60" y="230" width="170" height="80" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="2.5"/><text x="145.0" y="267.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Message</text><text x="145.0" y="286.0" text-anchor="middle" font-size="12" fill="#334155">(arguments and cues)</text>
<rect x="320" y="230" width="210" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="425.0" y="267.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Motivation and ability</text><text x="425.0" y="286.0" text-anchor="middle" font-size="12" fill="#334155">high or low?</text>
<line x1="230" y1="270" x2="320" y2="270" stroke="#334155" stroke-width="2.5"/>
<rect x="620" y="110" width="230" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/><text x="735.0" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Central path</text><text x="735.0" y="176.0" text-anchor="middle" font-size="12" fill="#334155">arguments are weighed</text>
<rect x="620" y="330" width="230" height="100" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/><text x="735.0" y="377.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Peripheral way</text><text x="735.0" y="396.0" text-anchor="middle" font-size="12" fill="#334155">cues matter</text>
<line x1="530" y1="255" x2="620" y2="175" stroke="#334155" stroke-width="2.5"/>
<line x1="530" y1="285" x2="620" y2="375" stroke="#334155" stroke-width="2.5"/>
<text x="535" y="200" font-size="12" font-weight="bold" fill="#059669">high</text><text x="528" y="352" font-size="12" font-weight="bold" fill="#0284C7">low</text><text x="735" y="240" text-anchor="middle" font-size="12" fill="#334155">more lasting attitude</text><text x="735" y="258" text-anchor="middle" font-size="12" fill="#334155">and more predictive of behavior</text><text x="735" y="455" text-anchor="middle" font-size="12" fill="#334155">more temporary attitude</text><text x="450" y="500" text-anchor="middle" font-size="11" fill="#64748B">Conceptual diagram (Petty and Cacioppo, 1986). The model is debated: the unimodel posits a single process.</text>
</svg>
