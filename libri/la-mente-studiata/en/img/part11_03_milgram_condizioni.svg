<svg xmlns="http://www.w3.org/2000/svg" width="900" height="502" viewBox="0 0 900 502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="502" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Obedience up to the maximum shock</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Percentage by condition (Milgram; about 40 participants per condition)</text><text x="288" y="129" text-anchor="end" font-size="13" fill="#334155">Another gives the shocks</text><rect x="300" y="110" width="481.0" height="28" fill="#7C3AED"/><text x="789.0" y="129" font-size="13" font-weight="bold" fill="#334155">92.5%</text>
<text x="288" y="175" text-anchor="end" font-size="13" fill="#334155">Original condition</text><rect x="300" y="156" width="338.0" height="28" fill="#0284C7"/><text x="646.0" y="175" font-size="13" font-weight="bold" fill="#334155">65%</text>
<text x="288" y="221" text-anchor="end" font-size="13" fill="#334155">Commercial office</text><rect x="300" y="202" width="247.0" height="28" fill="#0284C7"/><text x="555.0" y="221" font-size="13" font-weight="bold" fill="#334155">47.5%</text>
<text x="288" y="267" text-anchor="end" font-size="13" fill="#334155">Victim in the same room</text><rect x="300" y="248" width="208.0" height="28" fill="#0284C7"/><text x="516.0" y="267" font-size="13" font-weight="bold" fill="#334155">40%</text>
<text x="288" y="313" text-anchor="end" font-size="13" fill="#334155">Touch with the victim</text><rect x="300" y="294" width="156.0" height="28" fill="#0284C7"/><text x="464.0" y="313" font-size="13" font-weight="bold" fill="#334155">30%</text>
<text x="288" y="359" text-anchor="end" font-size="13" fill="#334155">Authority by phone</text><rect x="300" y="340" width="109.2" height="28" fill="#0284C7"/><text x="417.2" y="359" font-size="13" font-weight="bold" fill="#334155">21%</text>
<text x="288" y="405" text-anchor="end" font-size="13" fill="#334155">Two peers refuse</text><rect x="300" y="386" width="52.0" height="28" fill="#DC2626"/><text x="360.0" y="405" font-size="13" font-weight="bold" fill="#334155">10%</text>
<line x1="300" y1="100" x2="300" y2="424" stroke="#334155" stroke-width="2"/><text x="450" y="456" text-anchor="middle" font-size="12" fill="#334155">The percentages depend on the setup: they are not a constant of human nature.</text><text x="450" y="478" text-anchor="middle" font-size="11" fill="#64748B">Original condition: 26 of 40. With about 40 people per condition, estimates are uncertain (about ±15 pts).</text>
</svg>
