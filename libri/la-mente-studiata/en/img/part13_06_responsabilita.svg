<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="382" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Three answers on responsibility</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Stated as their defenders would; the data do not choose between them</text><rect x="20.0" y="96" width="310.6666666666667" height="56" rx="8" fill="#0284C7"/>
<text x="175.33333333333334" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Reason-responsiveness</text>
<text x="175.33333333333334" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Compatibilism; Strawson</text>
<rect x="20.0" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">What it rests on</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">On the capacity to act for reasons</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">and change given them</text>
<rect x="20.0" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="244" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Aim of the response</text>
<text x="30.0" y="262" text-anchor="start" font-size="12" fill="#334155">Assigning praise, blame as a practice</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">among us</text>
<rect x="20.0" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="310" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Main objection</text>
<text x="30.0" y="328" text-anchor="start" font-size="12" fill="#334155">Why should responsiveness</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">suffice for full blame?</text>
<rect x="344.6666666666667" y="96" width="310.6666666666667" height="56" rx="8" fill="#059669"/>
<text x="500.0" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Outcomes</text>
<text x="500.0" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Consequentialism</text>
<rect x="344.6666666666667" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">What it rests on</text>
<text x="354.6666666666667" y="196" text-anchor="start" font-size="12" fill="#334155">On the effects of sanctions:</text>
<text x="354.6666666666667" y="212" text-anchor="start" font-size="12" fill="#334155">deterrence, protection, rehabilitation</text>
<rect x="344.6666666666667" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="244" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Aim of the response</text>
<text x="354.6666666666667" y="262" text-anchor="start" font-size="12" fill="#334155">Reduce future harm with the</text>
<text x="354.6666666666667" y="278" text-anchor="start" font-size="12" fill="#334155">most effective tools</text>
<rect x="344.6666666666667" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="310" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Main objection</text>
<text x="354.6666666666667" y="328" text-anchor="start" font-size="12" fill="#334155">Could justify punishing an</text>
<text x="354.6666666666667" y="344" text-anchor="start" font-size="12" fill="#334155">innocent if useful</text>
<rect x="669.3333333333334" y="96" width="310.6666666666667" height="56" rx="8" fill="#7C3AED"/>
<text x="824.6666666666667" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">No retributive blame</text>
<text x="824.6666666666667" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Pereboom; Caruso; Sapolsky</text>
<rect x="669.3333333333334" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">What it rests on</text>
<text x="679.3333333333334" y="196" text-anchor="start" font-size="12" fill="#334155">On the fact no one is the ultimate</text>
<text x="679.3333333333334" y="212" text-anchor="start" font-size="12" fill="#334155">source of own acts</text>
<rect x="669.3333333333334" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="244" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Aim of the response</text>
<text x="679.3333333333334" y="262" text-anchor="start" font-size="12" fill="#334155">Protect others, with minimal</text>
<text x="679.3333333333334" y="278" text-anchor="start" font-size="12" fill="#334155">suffering, and act on causes</text>
<rect x="669.3333333333334" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="310" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Main objection</text>
<text x="679.3333333333334" y="328" text-anchor="start" font-size="12" fill="#334155">Risks treating people as</text>
<text x="679.3333333333334" y="344" text-anchor="start" font-size="12" fill="#334155">objects to manage</text>

</svg>
