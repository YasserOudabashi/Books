<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="540" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Harmful dysfunction</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Two distinct components: one factual (dysfunction), one evaluative (harm)</text><text x="390.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">No dysfunction</text>
<text x="710.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Dysfunction</text>
<text x="216" y="220.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">Harm</text>
<text x="216" y="370.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">No harm</text>
<rect x="234" y="144" width="312" height="142" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
<text x="390.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Distress without disorder</text>
<text x="390.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">Intense grief after a loss:</text>
<text x="390.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">the mechanism works as designed</text>
<rect x="554" y="144" width="312" height="142" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
<text x="710.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Disorder</text>
<text x="710.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">A heart that does not pump blood;</text>
<text x="710.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">for the mind: dysfunction plus harm</text>
<rect x="234" y="294" width="312" height="142" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
<text x="390.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">No disorder</text>
<text x="390.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Normal variation</text>
<text x="390.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">among people</text>
<rect x="554" y="294" width="312" height="142" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/>
<text x="710.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Dysfunction, no harm</text>
<text x="710.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Mirror reversal of the organs</text>
<text x="710.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">(situs inversus), usually harmless</text>
<text x="450.0" y="474" text-anchor="middle" font-size="13" fill="#334155">Only where both components coincide is there a disorder (Wakefield, 1992).</text>
<text x="450.0" y="496" text-anchor="middle" font-size="11" fill="#64748B">The proposal is debated: the evolved functions of mental mechanisms are often hypotheses.</text>

</svg>
