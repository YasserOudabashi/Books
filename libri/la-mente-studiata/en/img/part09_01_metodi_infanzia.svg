<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Four methods for studying a subject who cannot speak</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">What is presented, what is measured, what can be inferred</text>

  <rect x="30" y="85" width="840" height="32" rx="4" fill="#334155"/>
  <text x="45" y="106" font-size="13" font-weight="bold" fill="#FFFFFF">Method</text>
  <text x="250" y="106" font-size="13" font-weight="bold" fill="#FFFFFF">Presented</text>
  <text x="470" y="106" font-size="13" font-weight="bold" fill="#FFFFFF">Measured</text>
  <text x="680" y="106" font-size="13" font-weight="bold" fill="#FFFFFF">Inferred</text>

  <rect x="30" y="125" width="840" height="78" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="45" y="158" font-size="14" font-weight="bold" fill="#065F46">Visual preference</text>
  <text x="250" y="152" font-size="12" fill="#334155">two stimuli</text>
  <text x="250" y="170" font-size="12" fill="#334155">paired</text>
  <text x="470" y="152" font-size="12" fill="#334155">looking time</text>
  <text x="470" y="170" font-size="12" fill="#334155">at each</text>
  <text x="680" y="152" font-size="12" fill="#334155">tells the two apart</text>
  <text x="680" y="170" font-size="12" fill="#334155">and prefers one</text>

  <rect x="30" y="211" width="840" height="78" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="244" font-size="14" font-weight="bold" fill="#065F46">Habituation</text>
  <text x="250" y="238" font-size="12" fill="#334155">same stimulus repeated,</text>
  <text x="250" y="256" font-size="12" fill="#334155">then new one</text>
  <text x="470" y="238" font-size="12" fill="#334155">looking drops,</text>
  <text x="470" y="256" font-size="12" fill="#334155">then rises</text>
  <text x="680" y="238" font-size="12" fill="#334155">tells old</text>
  <text x="680" y="256" font-size="12" fill="#334155">from new</text>

  <rect x="30" y="297" width="840" height="78" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="45" y="323" font-size="14" font-weight="bold" fill="#065F46">High-amp.</text>
  <text x="45" y="341" font-size="14" font-weight="bold" fill="#065F46">sucking</text>
  <text x="250" y="330" font-size="12" fill="#334155">a sound per</text>
  <text x="250" y="348" font-size="12" fill="#334155">strong suck</text>
  <text x="470" y="330" font-size="12" fill="#334155">sucking rate</text>
  <text x="470" y="348" font-size="12" fill="#334155">over time</text>
  <text x="680" y="330" font-size="12" fill="#334155">tells sounds apart</text>
  <text x="680" y="348" font-size="12" fill="#334155">(auditory percept.)</text>

  <rect x="30" y="383" width="840" height="78" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="409" font-size="14" font-weight="bold" fill="#065F46">Violation</text>
  <text x="45" y="427" font-size="14" font-weight="bold" fill="#065F46">of expect.</text>
  <text x="250" y="416" font-size="12" fill="#334155">possible and</text>
  <text x="250" y="434" font-size="12" fill="#334155">impossible event</text>
  <text x="470" y="416" font-size="12" fill="#334155">looks longer</text>
  <text x="470" y="434" font-size="12" fill="#334155">at impossible event</text>
  <text x="680" y="416" font-size="12" fill="#92400E">perhaps: a violated</text>
  <text x="680" y="434" font-size="12" fill="#92400E">expect. (debated)</text>
</svg>
