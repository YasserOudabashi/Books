<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Five theories of emotion compared</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Same stimulus, body and appraisal — different order</text>

  <!-- James-Lange -->
  <rect x="60" y="100" width="150" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Stimulus</text>
  <path d="M 210,120 L 250,120" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="100" width="150" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Bodily arousal</text>
  <path d="M 405,120 L 445,120" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="100" width="180" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="540" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">Feeling (perceived)</text>
  <text x="700" y="125" font-size="12" fill="#334155" font-weight="bold">James-Lange</text>

  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker></defs>

  <!-- Cannon-Bard -->
  <rect x="60" y="160" width="150" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Stim. (thalamus)</text>
  <path d="M 210,175 L 250,150" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 210,185 L 250,210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="130" width="150" height="35" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Bodily arousal</text>
  <rect x="255" y="195" width="150" height="35" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">Feeling</text>
  <text x="500" y="185" font-size="12" fill="#334155" font-weight="bold">Cannon-Bard (parallel)</text>

  <!-- Schachter-Singer -->
  <rect x="60" y="245" width="150" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Stimulus</text>
  <path d="M 210,265 L 250,265" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="245" width="130" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">Arousal</text>
  <path d="M 385,265 L 425,265" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430" y="245" width="140" height="40" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="500" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Label from context</text>
  <path d="M 570,265 L 610,265" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="615" y="245" width="150" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="690" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">Labeled emotion</text>
  <text x="700" y="230" font-size="12" fill="#334155" font-weight="bold">Schachter-Singer</text>

  <!-- Appraisal -->
  <rect x="60" y="330" width="150" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Stimulus</text>
  <path d="M 210,350 L 250,350" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="330" width="160" height="40" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="335" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">Primary/secondary</text>
  <text x="335" y="363" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">appraisal</text>
  <path d="M 415,350 L 455,350" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="460" y="330" width="150" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="535" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">Emotion and body</text>
  <text x="700" y="355" font-size="12" fill="#334155" font-weight="bold">Appraisal (Lazarus)</text>

  <!-- Constructionist -->
  <rect x="60" y="410" width="150" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A8A">Sensory input</text>
  <text x="135" y="443" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A8A">+ stored concepts</text>
  <path d="M 210,430 L 250,430" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="410" width="150" height="40" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="330" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">Active prediction</text>
  <path d="M 405,430 L 445,430" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="410" width="180" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="540" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">Built emotion</text>
  <text x="700" y="435" font-size="12" fill="#334155" font-weight="bold">Constructivist (Barrett)</text>

  <rect x="150" y="480" width="600" height="30" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#075985">Same three ingredients, different order: no theory has been entirely falsified</text>
</svg>
