<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Forgetting curve</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Exponential decay of retention: R(t) = e^(−t/S)</text>

  <!-- axes -->
  <line x1="120" y1="420" x2="820" y2="420" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="420" x2="120" y2="100" stroke="#334155" stroke-width="2"/>
  <text x="470" y="460" text-anchor="middle" font-size="13" fill="#334155">time elapsed since learning (days)</text>
  <text x="60" y="260" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 60 260)">proportion retained R(t)</text>

  <!-- gridlines and labels x -->
  <text x="120" y="440" text-anchor="middle" font-size="11" fill="#64748B">0</text>
  <text x="260" y="440" text-anchor="middle" font-size="11" fill="#64748B">1</text>
  <text x="400" y="440" text-anchor="middle" font-size="11" fill="#64748B">2</text>
  <text x="540" y="440" text-anchor="middle" font-size="11" fill="#64748B">3</text>
  <text x="680" y="440" text-anchor="middle" font-size="11" fill="#64748B">4</text>
  <text x="820" y="440" text-anchor="middle" font-size="11" fill="#64748B">5</text>

  <text x="110" y="424" text-anchor="end" font-size="11" fill="#64748B">0</text>
  <text x="110" y="325" text-anchor="end" font-size="11" fill="#64748B">0.5</text>
  <text x="110" y="105" text-anchor="end" font-size="11" fill="#64748B">1.0</text>
  <line x1="120" y1="260" x2="820" y2="260" stroke="#E2E8F0" stroke-width="1"/>

  <!-- curve S=1: R = e^(-t) scaled: y=420 - 320*R -->
  <path d="M 120,100 C 200,220 260,300 400,360 C 500,390 650,410 820,415"
        fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="300" y="200" font-size="12" fill="#B91C1C" font-weight="bold">S = 1 (weak trace)</text>

  <!-- curve S=3 slower decay -->
  <path d="M 120,100 C 260,150 350,230 500,290 C 620,330 720,360 820,375"
        fill="none" stroke="#0284C7" stroke-width="3"/>
  <text x="560" y="255" font-size="12" fill="#075985" font-weight="bold">S = 3 (stronger trace)</text>

  <!-- markers -->
  <circle cx="260" cy="145" r="5" fill="#B91C1C"/>
  <text x="270" y="140" font-size="10" fill="#7F1D1D">R(1)≈0.37 (S=1)</text>

  <rect x="150" y="120" width="0" height="0"/>
</svg>
