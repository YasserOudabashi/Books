<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Amnesia from medial temporal lobe damage</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Dissociation between declarative and procedural memory in the same person</text>

  <!-- brain schematic -->
  <text x="230" y="105" text-anchor="middle" font-size="11" fill="#64748B">schematic representation</text>
  <ellipse cx="230" cy="240" rx="150" ry="90" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <ellipse cx="230" cy="245" rx="70" ry="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">medial temp.</text>
  <text x="230" y="264" text-anchor="middle" font-size="10" fill="#7F1D1D">lobe (removed)</text>

  <!-- task: mirror star drawing -->
  <rect x="500" y="100" width="330" height="130" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="665" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">Task: mirror-tracing a star,</text>
  <text x="665" y="143" text-anchor="middle" font-size="11" fill="#075985">session after session</text>
  <text x="665" y="170" text-anchor="middle" font-size="11" fill="#334155">Motor performance: improves</text>
  <text x="665" y="188" text-anchor="middle" font-size="11" fill="#334155">steadily, as in people with</text>
  <text x="665" y="206" text-anchor="middle" font-size="11" fill="#334155">no brain damage</text>

  <rect x="500" y="250" width="330" height="110" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="665" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">Explicit memory of the task</text>
  <text x="665" y="298" text-anchor="middle" font-size="11" fill="#991B1B">each session: "I've never</text>
  <text x="665" y="316" text-anchor="middle" font-size="11" fill="#991B1B">done this" — no conscious</text>
  <text x="665" y="334" text-anchor="middle" font-size="11" fill="#991B1B">trace of the previous sessions</text>

  <rect x="60" y="370" width="780" height="80" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Double dissociation in the same person, with the same brain damage:</text>
  <text x="450" y="415" text-anchor="middle" font-size="11" fill="#065F46">intact procedural memory (tracing improves) and impaired declarative memory</text>
  <text x="450" y="433" text-anchor="middle" font-size="11" fill="#065F46">(no explicit memory of doing the task) — direct evidence of separate systems</text>
</svg>
