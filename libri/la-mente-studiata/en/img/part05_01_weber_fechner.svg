<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Fechner's law: sensation versus physical intensity</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">S = k · ln(I / I₀) — sensation grows more slowly than the stimulus</text>

  <!-- axes -->
  <line x1="110" y1="420" x2="820" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="110" y1="420" x2="110" y2="100" stroke="#334155" stroke-width="1.5"/>
  <text x="465" y="460" text-anchor="middle" font-size="13" fill="#334155">Physical stimulus intensity (I)</text>
  <text x="55" y="260" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 55 260)">Subjective sensation (S)</text>

  <!-- logarithmic curve approximation using polyline -->
  <path d="M 130,410 C 220,300 280,230 380,190 C 480,150 620,120 800,110"
        fill="none" stroke="#0284C7" stroke-width="3"/>

  <!-- linear reference dashed line for comparison -->
  <line x1="130" y1="410" x2="800" y2="115" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="200" text-anchor="middle" font-size="11" fill="#DC2626">if growth were linear</text>

  <!-- marked points I=10 and I=100 -->
  <circle cx="300" cy="222" r="6" fill="#0284C7"/>
  <text x="300" y="245" text-anchor="middle" font-size="11" fill="#075985">I=10 → S≈2.30</text>

  <circle cx="620" cy="132" r="6" fill="#0284C7"/>
  <text x="620" y="115" text-anchor="middle" font-size="11" fill="#075985">I=100 → S≈4.61</text>

  <text x="465" y="490" text-anchor="middle" font-size="12" fill="#334155">A tenfold increase in physical intensity yields less than double the sensation — logarithmic growth, not linear.</text>
</svg>
