<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The "split-brain" experiment</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">A stimulus shown to one visual field reaches only one hemisphere</text>

  <!-- brain outline split -->
  <ellipse cx="450" cy="220" rx="220" ry="130" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="95" x2="450" y2="345" stroke="#DC2626" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="468" y="225" text-anchor="middle" font-size="10" fill="#DC2626" transform="rotate(-90 468 225)">severed corpus callosum</text>

  <text x="330" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Left hemisphere</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#1E40AF">(verbal)</text>
  <text x="330" y="230" text-anchor="middle" font-size="12" fill="#334155">input: right visual field</text>

  <text x="570" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">Right hemisph.</text>
  <text x="570" y="200" text-anchor="middle" font-size="11" fill="#166534">(nonverbal)</text>
  <text x="570" y="230" text-anchor="middle" font-size="12" fill="#334155">receives: left visual field</text>

  <!-- outcomes -->
  <rect x="180" y="270" width="300" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="330" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Can name aloud</text>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#1E40AF">the object seen</text>
  <text x="330" y="335" text-anchor="middle" font-size="11" fill="#1E40AF">("an apple")</text>

  <rect x="480" y="270" width="300" height="90" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="630" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532D">Denies seeing anything,</text>
  <text x="630" y="315" text-anchor="middle" font-size="11" fill="#166534">but the left hand picks</text>
  <text x="630" y="335" text-anchor="middle" font-size="11" fill="#166534">the right object by touch</text>

  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#334155">The verbal report reflects only what the language hemisphere can access —</text>
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#334155">not a neutral window onto "everything the brain knows".</text>
</svg>
