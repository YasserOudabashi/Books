<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Memory systems</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">From sensory memory to the declarative/procedural distinction</text>

  <!-- flow: sensory -> working -> long term -->
  <rect x="60" y="100" width="200" height="80" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">Sensory memory</text>
  <text x="160" y="146" text-anchor="middle" font-size="10" fill="#075985">fractions of a sec</text>
  <text x="160" y="162" text-anchor="middle" font-size="10" fill="#075985">raw impression of stimulus</text>

  <path d="M 260,140 L 330,140" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker></defs>

  <rect x="335" y="100" width="220" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="445" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Working memory</text>
  <text x="445" y="140" text-anchor="middle" font-size="10" fill="#3730A3">tens of seconds</text>
  <text x="445" y="156" text-anchor="middle" font-size="10" fill="#3730A3">phonological loop + visuo-</text>
  <text x="445" y="171" text-anchor="middle" font-size="10" fill="#3730A3">spatial sketchpad + central exec.</text>

  <path d="M 555,140 L 620,140" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="625" y="100" width="220" height="80" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="735" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Long-term memory</text>
  <text x="735" y="146" text-anchor="middle" font-size="10" fill="#065F46">minutes to decades</text>
  <text x="735" y="162" text-anchor="middle" font-size="10" fill="#065F46">no known capacity limit</text>

  <path d="M 735,180 L 735,225" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- split declarative/procedural -->
  <rect x="480" y="230" width="230" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="595" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">Declarative (explicit)</text>
  <text x="595" y="275" text-anchor="middle" font-size="10" fill="#7F1D1D">semantic: world facts</text>
  <text x="595" y="292" text-anchor="middle" font-size="10" fill="#7F1D1D">episodic: personal events</text>
  <text x="595" y="315" text-anchor="middle" font-size="10" fill="#991B1B">accessible to awareness</text>
  <text x="595" y="335" text-anchor="middle" font-size="10" fill="#991B1B">depends on hippocampus</text>
  <text x="595" y="355" text-anchor="middle" font-size="10" fill="#991B1B">and medial temporal lobe</text>

  <rect x="760" y="230" width="130" height="140" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="825" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Procedural</text>
  <text x="825" y="278" text-anchor="middle" font-size="10" fill="#92400E">(implicit)</text>
  <text x="825" y="300" text-anchor="middle" font-size="10" fill="#92400E">motor and</text>
  <text x="825" y="317" text-anchor="middle" font-size="10" fill="#92400E">cog. skills</text>
  <text x="825" y="340" text-anchor="middle" font-size="10" fill="#B45309">basal ganglia,</text>
  <text x="825" y="357" text-anchor="middle" font-size="10" fill="#B45309">cerebellum</text>

  <path d="M 710,300 L 760,300" stroke="#94A3B8" stroke-width="2"/>

  <rect x="100" y="230" width="330" height="140" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="265" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Key evidence: double dissociation</text>
  <text x="265" y="280" text-anchor="middle" font-size="10" fill="#334155">in amnesia from medial temporal lobe damage:</text>
  <text x="265" y="300" text-anchor="middle" font-size="10" fill="#334155">declarative memory severely impaired,</text>
  <text x="265" y="318" text-anchor="middle" font-size="10" fill="#334155">procedural memory relatively intact</text>
  <text x="265" y="340" text-anchor="middle" font-size="10" fill="#475569">in the same person (ch. 40)</text>

  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#334155">The distinction between systems is not only functional: dissociable neural bases confirm it.</text>
</svg>
