<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The twin study design</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Comparing similarity in two kinds of pairs to estimate heritability</text>

  <!-- MZ twins -->
  <rect x="80" y="100" width="330" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="245" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Monozygotic twins (MZ)</text>
  <text x="245" y="145" text-anchor="middle" font-size="11" fill="#1E40AF">Shared DNA: ~100%</text>
  <circle cx="170" cy="190" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="320" cy="190" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <line x1="200" y1="190" x2="290" y2="190" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="245" y="240" text-anchor="middle" font-size="12" fill="#1E3A8A">observed correlation: r_MZ</text>

  <!-- DZ twins -->
  <rect x="490" y="100" width="330" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="655" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">Dizygotic twins (DZ)</text>
  <text x="655" y="145" text-anchor="middle" font-size="11" fill="#166534">Shared DNA: ~50%, like ordinary siblings</text>
  <circle cx="580" cy="190" r="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <circle cx="730" cy="190" r="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <line x1="610" y1="190" x2="700" y2="190" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="655" y="240" text-anchor="middle" font-size="12" fill="#14532D">observed correlation: r_DZ</text>

  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#334155">Logic: if a trait is influenced by genes, MZ (identical) twins should resemble each other</text>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#334155">more than DZ — given, in theory, equal environments.</text>

  <!-- formula box -->
  <rect x="230" y="350" width="440" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">h² = 2 × (r_MZ − r_DZ)</text>
  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#92400E">Example: r_MZ = 0.70, r_DZ = 0.40</text>
  <text x="450" y="423" text-anchor="middle" font-size="11" fill="#92400E">h² = 2 × (0.70 − 0.40) = 0.60</text>
  <text x="450" y="443" text-anchor="middle" font-size="10" fill="#92400E">estimate valid only under the equal environments assumption</text>

  <text x="450" y="495" text-anchor="middle" font-size="11" fill="#94A3B8">Heritability is a property of the population studied, not an individual destiny.</text>
</svg>
