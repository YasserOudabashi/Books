<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="440" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The Sally-Anne task</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Four moments of the story told to the child</text>

  <rect x="40" y="100" width="190" height="190" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="135" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">1</text>
  <rect x="62" y="190" width="60" height="50" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <circle cx="92" cy="206" r="8" fill="#DC2626"/>
  <text x="92" y="262" text-anchor="middle" font-size="11" fill="#334155">basket</text>
  <rect x="150" y="190" width="60" height="50" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="180" y="262" text-anchor="middle" font-size="11" fill="#334155">box</text>
  <text x="135" y="160" text-anchor="middle" font-size="12" fill="#334155">Sally puts the marble</text>

  <rect x="255" y="100" width="190" height="190" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="350" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">2</text>
  <rect x="277" y="190" width="60" height="50" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <circle cx="307" cy="206" r="8" fill="#DC2626"/>
  <rect x="365" y="190" width="60" height="50" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="350" y="160" text-anchor="middle" font-size="12" fill="#334155">Sally out</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" fill="#64748B">the marble stays in basket</text>

  <rect x="470" y="100" width="190" height="190" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="565" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">3</text>
  <rect x="492" y="190" width="60" height="50" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <rect x="580" y="190" width="60" height="50" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <circle cx="610" cy="206" r="8" fill="#DC2626"/>
  <path d="M 530,175 C 550,150 590,150 605,180" fill="none" stroke="#64748B" stroke-width="2"/>
  <polygon points="607,186 597,176 611,174" fill="#64748B"/>
  <text x="565" y="276" text-anchor="middle" font-size="11" fill="#64748B">Anne moves the marble</text>

  <rect x="685" y="100" width="190" height="190" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="780" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">4</text>
  <rect x="707" y="190" width="60" height="50" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <rect x="795" y="190" width="60" height="50" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="737" y="224" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400E">?</text>
  <text x="825" y="224" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400E">?</text>
  <text x="780" y="160" text-anchor="middle" font-size="12" fill="#334155">Sally returns</text>

  <rect x="100" y="320" width="700" height="80" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Where will Sally look for it?</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#334155">Correct answer: the basket, where she thinks it is.</text>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#334155">At age three many children point to the box, where the marble is.</text>
</svg>
