<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Two ways to measure a trajectory</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">The same phenomenon looks different by research design</text>

  <line x1="120" y1="400" x2="820" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="400" x2="120" y2="110" stroke="#334155" stroke-width="2"/>
  <text x="62" y="255" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 62 255)">performance (arbitrary units)</text>
  <text x="150" y="422" text-anchor="middle" font-size="11" fill="#334155">25</text>
  <text x="465" y="422" text-anchor="middle" font-size="11" fill="#334155">50</text>
  <text x="780" y="422" text-anchor="middle" font-size="11" fill="#334155">75</text>
  <text x="465" y="444" text-anchor="middle" font-size="12" fill="#334155">age (yrs)</text>

  <line x1="150" y1="160" x2="780" y2="260" stroke="#059669" stroke-width="3"/>
  <line x1="150" y1="160" x2="780" y2="330" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 5"/>

  <text x="465" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">longitudinal design: the same people followed over time</text>
  <text x="560" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#B91C1C">cross-sectional: age and cohort are confounded</text>

  <text x="450" y="466" text-anchor="middle" font-size="11" fill="#64748B">Illustrative conceptual diagram, not data from a single study.</text>
</svg>
