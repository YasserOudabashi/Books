<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The structural model: id, ego, superego</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Three agencies in mutual tension, not three physical brain sites</text>

  <!-- Es -->
  <circle cx="270" cy="260" r="130" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="270" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#991B1B">Id (Es)</text>
  <text x="270" y="255" text-anchor="middle" font-size="12" fill="#7F1D1D">drives and desires</text>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#7F1D1D">unfiltered</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#991B1B">pleasure principle</text>

  <!-- Super-io -->
  <circle cx="630" cy="260" r="130" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="630" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A8A">Superego</text>
  <text x="630" y="255" text-anchor="middle" font-size="12" fill="#1E40AF">internalized</text>
  <text x="630" y="272" text-anchor="middle" font-size="12" fill="#1E40AF">norms, taboos</text>
  <text x="630" y="292" text-anchor="middle" font-size="11" fill="#1E3A8A">judgment, moral censor</text>

  <!-- Io overlap -->
  <circle cx="450" cy="260" r="100" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5" opacity="0.92"/>
  <text x="450" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532D">Ego (Io)</text>
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#166534">mediates drives,</text>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#166534">norms, outer reality</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#14532D">reality principle</text>

  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#334155">Much of everyday mental life is described as a continual compromise</text>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#334155">between the id's pressures, the superego's constraints and reality's limits.</text>
  <text x="450" y="495" text-anchor="middle" font-size="12" fill="#94A3B8">Applied to the case of dreams (ch. 9) and of delusion (ch. 12).</text>
</svg>
