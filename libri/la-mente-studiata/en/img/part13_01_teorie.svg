<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="516" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">The main theories of consciousness</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">What each claims, where it locates it, what it predicts</text><rect x="20.0" y="96" width="229.5" height="56" rx="8" fill="#0284C7"/>
<text x="134.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Global workspace</text>
<text x="134.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Baars; Dehaene</text>
<rect x="20.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Core idea</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">Information becomes</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">conscious when broadcast</text>
<text x="30.0" y="228" text-anchor="start" font-size="12" fill="#334155">to many systems</text>
<rect x="20.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="260" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Where</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">Prefrontal and</text>
<text x="30.0" y="294" text-anchor="start" font-size="12" fill="#334155">parietal</text>
<rect x="20.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="326" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Prediction</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">Sudden, sustained</text>
<text x="30.0" y="360" text-anchor="start" font-size="12" fill="#334155">ignition, even at the end</text>
<text x="30.0" y="376" text-anchor="start" font-size="12" fill="#334155">of stimulus</text>
<rect x="20.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="408" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Main objection</text>
<text x="30.0" y="426" text-anchor="start" font-size="12" fill="#334155">Explains access, more</text>
<text x="30.0" y="442" text-anchor="start" font-size="12" fill="#334155">than experience</text>
<rect x="263.5" y="96" width="229.5" height="56" rx="8" fill="#059669"/>
<text x="378.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Integrated information</text>
<text x="378.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Tononi</text>
<rect x="263.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Core idea</text>
<text x="273.5" y="196" text-anchor="start" font-size="12" fill="#334155">Consciousness equals the</text>
<text x="273.5" y="212" text-anchor="start" font-size="12" fill="#334155">degree of causal</text>
<text x="273.5" y="228" text-anchor="start" font-size="12" fill="#334155">integration (Φ)</text>
<rect x="263.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="260" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Where</text>
<text x="273.5" y="278" text-anchor="start" font-size="12" fill="#334155">Posterior cortical</text>
<text x="273.5" y="294" text-anchor="start" font-size="12" fill="#334155">areas</text>
<rect x="263.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="326" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Prediction</text>
<text x="273.5" y="344" text-anchor="start" font-size="12" fill="#334155">Sustained integrated</text>
<text x="273.5" y="360" text-anchor="start" font-size="12" fill="#334155">activity in the back</text>
<text x="273.5" y="376" text-anchor="start" font-size="12" fill="#334155">areas</text>
<rect x="263.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="408" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Main objection</text>
<text x="273.5" y="426" text-anchor="start" font-size="12" fill="#334155">Hard to compute and</text>
<text x="273.5" y="442" text-anchor="start" font-size="12" fill="#334155">to test</text>
<rect x="507.0" y="96" width="229.5" height="56" rx="8" fill="#D97706"/>
<text x="621.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Recurrent processing</text>
<text x="621.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Lamme</text>
<rect x="507.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="178" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Core idea</text>
<text x="517.0" y="196" text-anchor="start" font-size="12" fill="#334155">Experience arises when</text>
<text x="517.0" y="212" text-anchor="start" font-size="12" fill="#334155">information feeds back to</text>
<text x="517.0" y="228" text-anchor="start" font-size="12" fill="#334155">sensory areas</text>
<rect x="507.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="260" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Where</text>
<text x="517.0" y="278" text-anchor="start" font-size="12" fill="#334155">Sensory areas, even</text>
<text x="517.0" y="294" text-anchor="start" font-size="12" fill="#334155">w/o frontal lobe</text>
<rect x="507.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="326" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Prediction</text>
<text x="517.0" y="344" text-anchor="start" font-size="12" fill="#334155">Feedback present when</text>
<text x="517.0" y="360" text-anchor="start" font-size="12" fill="#334155">stimulus is seen</text>
<rect x="507.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="408" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Main objection</text>
<text x="517.0" y="426" text-anchor="start" font-size="12" fill="#334155">Telling experience from</text>
<text x="517.0" y="442" text-anchor="start" font-size="12" fill="#334155">report remains hard</text>
<rect x="750.5" y="96" width="229.5" height="56" rx="8" fill="#7C3AED"/>
<text x="865.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Higher-order</text>
<text x="865.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Rosenthal; Lau</text>
<rect x="750.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Core idea</text>
<text x="760.5" y="196" text-anchor="start" font-size="12" fill="#334155">A state is conscious if the</text>
<text x="760.5" y="212" text-anchor="start" font-size="12" fill="#334155">system has a</text>
<text x="760.5" y="228" text-anchor="start" font-size="12" fill="#334155">representation of it</text>
<rect x="750.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="260" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Where</text>
<text x="760.5" y="278" text-anchor="start" font-size="12" fill="#334155">Prefrontal areas</text>
<rect x="750.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="326" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Prediction</text>
<text x="760.5" y="344" text-anchor="start" font-size="12" fill="#334155">Without higher-order</text>
<text x="760.5" y="360" text-anchor="start" font-size="12" fill="#334155">representation, no</text>
<text x="760.5" y="376" text-anchor="start" font-size="12" fill="#334155">experience</text>
<rect x="750.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="408" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Main objection</text>
<text x="760.5" y="426" text-anchor="start" font-size="12" fill="#334155">Needs abilities that</text>
<text x="760.5" y="442" text-anchor="start" font-size="12" fill="#334155">some animals and infants</text>
<text x="760.5" y="458" text-anchor="start" font-size="12" fill="#334155">may lack</text>
<text x="500.0" y="494" text-anchor="middle" font-size="12" fill="#64748B">They diverge on testable points: so an experiment can be built to pit them against each other.</text>

</svg>
