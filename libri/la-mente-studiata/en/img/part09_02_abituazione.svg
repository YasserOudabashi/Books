<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Habituation &amp; dishabituation</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Looking time at each presentation (schematic trend)</text>

  <line x1="120" y1="380" x2="820" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="380" x2="120" y2="110" stroke="#334155" stroke-width="2"/>
  <text x="108" y="384" text-anchor="end" font-size="11" fill="#334155">0</text>
  <text x="108" y="249" text-anchor="end" font-size="11" fill="#334155">10</text>
  <text x="108" y="114" text-anchor="end" font-size="11" fill="#334155">20</text>
  <text x="62" y="245" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 62 245)">looking time (s)</text>

  <line x1="120" y1="258" x2="640" y2="258" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="565" y="250" text-anchor="middle" font-size="11" fill="#92400E">habituation criterion</text>
  <text x="565" y="276" text-anchor="middle" font-size="11" fill="#92400E">(half the initial value)</text>

  <line x1="655" y1="120" x2="655" y2="380" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 4"/>

  <path d="M 150,137 L 215,177 L 280,218 L 345,258 L 410,286 L 475,313 L 540,326 L 605,340" fill="none" stroke="#059669" stroke-width="3"/>
  <circle cx="150" cy="137" r="5" fill="#059669"/>
  <circle cx="215" cy="177" r="5" fill="#059669"/>
  <circle cx="280" cy="218" r="5" fill="#059669"/>
  <circle cx="345" cy="258" r="5" fill="#059669"/>
  <circle cx="410" cy="286" r="5" fill="#059669"/>
  <circle cx="475" cy="313" r="5" fill="#059669"/>
  <circle cx="540" cy="326" r="5" fill="#059669"/>
  <circle cx="605" cy="340" r="5" fill="#059669"/>

  <circle cx="720" cy="232" r="7" fill="#2563EB"/>
  <circle cx="780" cy="340" r="7" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
  <text x="720" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8">new stimulus</text>
  <text x="780" y="322" text-anchor="middle" font-size="11" fill="#475569">same stimulus</text>

  <text x="380" y="408" text-anchor="middle" font-size="12" fill="#334155">repeated presentations (habituation)</text>
  <text x="750" y="408" text-anchor="middle" font-size="12" fill="#334155">test</text>

  <text x="450" y="445" text-anchor="middle" font-size="11" fill="#64748B">Illustrative values: the diagram shows the typical shape of the effect, not data from one study.</text>
</svg>
