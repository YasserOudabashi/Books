<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">L'entonnoir du biais de publication</text>

  <!-- 10 studies conducted -->
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#334155">10 laboratoires indépendants testent la même hypothèse (en réalité fausse)</text>
  <g>
    <circle cx="140" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="220" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="300" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="380" cy="110" r="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <circle cx="460" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="540" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="620" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="700" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="780" cy="110" r="18" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="380" cy="150" r="0" />
  </g>
  <text x="380" y="150" text-anchor="middle" font-size="12" fill="#DC2626">1 sur 10, par hasard, est « significatif »</text>

  <!-- funnel -->
  <polygon points="120,190 780,190 560,340 340,340" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" fill="#334155">Sélection éditoriale : les revues préfèrent les résultats significatifs</text>

  <!-- published -->
  <circle cx="450" cy="380" r="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="450" y="425" text-anchor="middle" font-size="14" fill="#334155">Publié : 1 étude positive</text>

  <!-- drawer -->
  <rect x="600" y="360" width="220" height="60" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="710" y="395" text-anchor="middle" font-size="13" fill="#64748B">9 études nulles : dans un tiroir</text>

  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#334155">La littérature visible ne montre que l'exception, pas la règle.</text>
</svg>
