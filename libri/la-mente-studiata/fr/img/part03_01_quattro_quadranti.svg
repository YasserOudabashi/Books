<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Les quatre quadrants du conditionnement opérant</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Positif/négatif = ajout/retrait ; pas « bon/mauvais »</text>

  <!-- column/row headers -->
  <text x="290" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Le comportement AUGMENTE</text>
  <text x="650" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Le comportement DIMINUE</text>
  <text x="90" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 90 180)">On AJOUTE (positif)</text>
  <text x="90" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 90 360)">On RETIRE (négatif)</text>

  <!-- quadrant 1: rinforzo positivo -->
  <rect x="130" y="115" width="320" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Renforcement positif</text>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#064E3B">On ajoute quelque chose d'agréable</text>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#064E3B">Ex. : récompense quand le chien s'assoit</text>

  <!-- quadrant 2: punizione positiva -->
  <rect x="490" y="115" width="320" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">Punition positive</text>
  <text x="650" y="170" text-anchor="middle" font-size="11" fill="#7F1D1D">On ajoute quelque chose de désagréable</text>
  <text x="650" y="190" text-anchor="middle" font-size="11" fill="#7F1D1D">Ex. : légère décharge quand le chien aboie</text>

  <!-- quadrant 3: rinforzo negativo -->
  <rect x="130" y="290" width="320" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="290" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Renforcement négatif</text>
  <text x="290" y="345" text-anchor="middle" font-size="11" fill="#064E3B">On retire quelque chose de désagréable</text>
  <text x="290" y="365" text-anchor="middle" font-size="11" fill="#064E3B">Ex. : l'alarme cesse quand on boucle sa ceinture</text>

  <!-- quadrant 4: punizione negativa -->
  <rect x="490" y="290" width="320" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">Punition négative</text>
  <text x="650" y="345" text-anchor="middle" font-size="11" fill="#7F1D1D">On retire quelque chose d'agréable</text>
  <text x="650" y="365" text-anchor="middle" font-size="11" fill="#7F1D1D">Ex. : on retire le téléphone</text>

  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#94A3B8">Renforcement et punition se définissent par l'effet observé, jamais par l'intention.</text>
</svg>
