<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="475" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le camp d'été en trois phases</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">22 garçons de onze et douze ans, deux groupes</text><rect x="40" y="150" width="240" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/><text x="160.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">1. Formation</text><text x="160.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">deux groupes séparés,</text>
<text x="160" y="262" text-anchor="middle" font-size="12" fill="#334155">qui ne se connaissent pas</text><rect x="330" y="150" width="240" height="150" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/><text x="450.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">2. Compétition</text><text x="450.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">jeux d'équipe et prix,</text>
<text x="450" y="262" text-anchor="middle" font-size="12" fill="#334155">hostilité entre les groupes</text><rect x="620" y="150" width="240" height="150" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/><text x="740.0" y="222.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">3. Intégration</text><text x="740.0" y="241.0" text-anchor="middle" font-size="12" fill="#334155">le contact seul ne suffit pas ;</text>
<text x="740" y="262" text-anchor="middle" font-size="12" fill="#334155">buts supraordonnés : oui</text><line x1="280" y1="225" x2="330" y2="225" stroke="#334155" stroke-width="2.5"/>
<line x1="570" y1="225" x2="620" y2="225" stroke="#334155" stroke-width="2.5"/>
<text x="450" y="350" text-anchor="middle" font-size="13" fill="#334155">Environ 93 % des amitiés déclarées étaient internes au groupe pendant la compétition.</text><text x="450" y="390" text-anchor="middle" font-size="12" fill="#334155">Limites : petit échantillon homogène, expérimentateurs présents au camp,</text><text x="450" y="408" text-anchor="middle" font-size="12" fill="#334155">tentatives précédentes échouées, réplication à Beyrouth avec conflit entre les groupes créés.</text><text x="450" y="450" text-anchor="middle" font-size="11" fill="#64748B">Sherif et collaborateurs (1954).</text>
</svg>
