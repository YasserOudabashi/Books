<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le circuit du conditionnement de la peur</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Du son (ou de la lumière, dans l'expérience optogénétique) à la réponse d'immobilité</text>

  <rect x="80" y="110" width="170" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="165" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Son neutre</text>
  <text x="165" y="153" text-anchor="middle" font-size="10" fill="#1E40AF">(cortex auditif)</text>

  <rect x="80" y="230" width="170" height="55" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="165" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">Choc électrique</text>
  <text x="165" y="273" text-anchor="middle" font-size="10" fill="#991B1B">(stimulus aversif)</text>

  <path d="M 250,140 L 380,170" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrf)"/>
  <path d="M 250,255 L 380,200" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrf)"/>
  <defs><marker id="arrf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker></defs>

  <rect x="385" y="160" width="200" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="485" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Amygdale latérale</text>
  <text x="485" y="203" text-anchor="middle" font-size="10" fill="#92400E">siège de la plasticité synaptique</text>

  <path d="M 585,190 L 630,190" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrf)"/>
  <rect x="635" y="160" width="180" height="60" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="725" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">Noyau central</text>
  <text x="725" y="203" text-anchor="middle" font-size="10" fill="#5B21B6">de l'amygdale</text>

  <path d="M 725,220 L 725,280" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrf)"/>
  <rect x="620" y="285" width="210" height="55" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="725" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Immobilité d'alarme</text>
  <text x="725" y="326" text-anchor="middle" font-size="10" fill="#047857">(freezing) et réponse autonome</text>

  <rect x="180" y="370" width="540" height="55" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="450" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">La stimulation optique directe des axones, sans le son, reproduit l'apprentissage</text>
  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#075985">seulement si elle est associée dans le temps au choc : la coïncidence est nécessaire, l'entrée seule ne suffit pas</text>
</svg>
