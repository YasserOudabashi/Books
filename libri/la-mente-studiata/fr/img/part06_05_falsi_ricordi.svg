<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le paradigme du mot critique</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Mots associés présentés, le mot critique non — mais il est « rappelé »</text>

  <!-- list of words presented -->
  <rect x="80" y="100" width="330" height="230" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="245" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">Mots effectivement présentés</text>
  <text x="245" y="150" text-anchor="middle" font-size="11" fill="#334155">lit · repos · éveillé · fatigué</text>
  <text x="245" y="170" text-anchor="middle" font-size="11" fill="#334155">rêve · ronfler · oreiller</text>
  <text x="245" y="190" text-anchor="middle" font-size="11" fill="#334155">bâillement · sieste · couverture</text>
  <text x="245" y="210" text-anchor="middle" font-size="11" fill="#334155">nuit · somme · paresseux</text>
  <text x="245" y="245" text-anchor="middle" font-size="10" fill="#0369A1">tous fortement associés à</text>
  <text x="245" y="263" text-anchor="middle" font-size="10" fill="#0369A1">un mot qui n'apparaît jamais :</text>
  <rect x="150" y="278" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="245" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">« SOMMEIL »</text>

  <path d="M 410,215 L 500,215" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr3)"/>
  <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker></defs>
  <text x="455" y="205" text-anchor="middle" font-size="10" fill="#64748B">test de</text>
  <text x="455" y="228" text-anchor="middle" font-size="10" fill="#64748B">reconnaissance</text>

  <rect x="505" y="100" width="315" height="230" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="662" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">Résultat typique</text>
  <text x="662" y="155" text-anchor="middle" font-size="11" fill="#334155">40-80 % des participants rapportent</text>
  <text x="662" y="175" text-anchor="middle" font-size="11" fill="#334155">avoir vu « sommeil » dans la liste</text>
  <text x="662" y="205" text-anchor="middle" font-size="11" fill="#991B1B">souvent avec la même assurance</text>
  <text x="662" y="223" text-anchor="middle" font-size="11" fill="#991B1B">subjective que pour les vrais mots</text>
  <text x="662" y="253" text-anchor="middle" font-size="10" fill="#7F1D1D">dans certains cas avec des détails supplémentaires</text>
  <text x="662" y="271" text-anchor="middle" font-size="10" fill="#7F1D1D">(p. ex. « à quel endroit de la liste »)</text>
  <text x="662" y="289" text-anchor="middle" font-size="10" fill="#7F1D1D">impossibles, car jamais présenté</text>

  <rect x="150" y="370" width="600" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Le faux souvenir naît de l'association sémantique automatique,</text>
  <text x="450" y="415" text-anchor="middle" font-size="11" fill="#92400E">non d'une tentative de tromper ni d'un défaut isolé de la mémoire</text>
</svg>
