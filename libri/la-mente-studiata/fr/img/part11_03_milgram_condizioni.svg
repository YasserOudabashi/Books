<svg xmlns="http://www.w3.org/2000/svg" width="900" height="502" viewBox="0 0 900 502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="502" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Obéissance jusqu'au choc maximal</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Pourcentage par condition (Milgram ; environ 40 participants par condition)</text><text x="288" y="129" text-anchor="end" font-size="13" fill="#334155">Un autre administre les chocs</text><rect x="300" y="110" width="481.0" height="28" fill="#7C3AED"/><text x="789.0" y="129" font-size="13" font-weight="bold" fill="#334155">92,5%</text>
<text x="288" y="175" text-anchor="end" font-size="13" fill="#334155">Condition originale</text><rect x="300" y="156" width="338.0" height="28" fill="#0284C7"/><text x="646.0" y="175" font-size="13" font-weight="bold" fill="#334155">65%</text>
<text x="288" y="221" text-anchor="end" font-size="13" fill="#334155">Bureau commercial</text><rect x="300" y="202" width="247.0" height="28" fill="#0284C7"/><text x="555.0" y="221" font-size="13" font-weight="bold" fill="#334155">47,5%</text>
<text x="288" y="267" text-anchor="end" font-size="13" fill="#334155">Victime dans la même pièce</text><rect x="300" y="248" width="208.0" height="28" fill="#0284C7"/><text x="516.0" y="267" font-size="13" font-weight="bold" fill="#334155">40%</text>
<text x="288" y="313" text-anchor="end" font-size="13" fill="#334155">Contact avec la victime</text><rect x="300" y="294" width="156.0" height="28" fill="#0284C7"/><text x="464.0" y="313" font-size="13" font-weight="bold" fill="#334155">30%</text>
<text x="288" y="359" text-anchor="end" font-size="13" fill="#334155">Autorité au téléphone</text><rect x="300" y="340" width="109.2" height="28" fill="#0284C7"/><text x="417.2" y="359" font-size="13" font-weight="bold" fill="#334155">21%</text>
<text x="288" y="405" text-anchor="end" font-size="13" fill="#334155">Deux compagnons refusent</text><rect x="300" y="386" width="52.0" height="28" fill="#DC2626"/><text x="360.0" y="405" font-size="13" font-weight="bold" fill="#334155">10%</text>
<line x1="300" y1="100" x2="300" y2="424" stroke="#334155" stroke-width="2"/><text x="450" y="456" text-anchor="middle" font-size="12" fill="#334155">Les pourcentages dépendent du dispositif : ils ne sont pas une constante de la nature humaine.</text><text x="450" y="478" text-anchor="middle" font-size="11" fill="#64748B">Condition originale : 26 sur 40. Avec environ 40 personnes par condition, les estimations sont incertaines (±15 points environ).</text>
</svg>
