<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="540" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Dysfonction préjudiciable</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Deux composantes distinctes : l'une factuelle (dysfonction) et l'autre de valeur (préjudice)</text><text x="390.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Aucune dysfonction</text>
<text x="710.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Dysfonction</text>
<text x="216" y="220.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">Préjudice</text>
<text x="216" y="370.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">Aucun préjudice</text>
<rect x="234" y="144" width="312" height="142" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
<text x="390.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Souffrance sans trouble</text>
<text x="390.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">Douleur intense après une perte :</text>
<text x="390.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">le mécanisme fonctionne comme prévu</text>
<rect x="554" y="144" width="312" height="142" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
<text x="710.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Trouble</text>
<text x="710.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">Le cœur qui ne pompe pas le sang ;</text>
<text x="710.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">pour l'esprit : dysfonction et préjudice ensemble</text>
<rect x="234" y="294" width="312" height="142" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
<text x="390.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Aucun trouble</text>
<text x="390.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Variation normale</text>
<text x="390.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">entre les personnes</text>
<rect x="554" y="294" width="312" height="142" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/>
<text x="710.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Dysfonction sans préjudice</text>
<text x="710.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Inversion en miroir des organes</text>
<text x="710.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">(situs inversus), en général inoffensive</text>
<text x="450.0" y="474" text-anchor="middle" font-size="13" fill="#334155">Il y a trouble seulement là où les deux composantes coïncident (Wakefield, 1992).</text>
<text x="450.0" y="496" text-anchor="middle" font-size="11" fill="#64748B">La proposition est débattue : les fonctions évolutives des mécanismes mentaux sont souvent des hypothèses.</text>

</svg>
