<text x="450.0" y="348" text-anchor="middle" font-size="12" fill="#334155">Les tranches sont une convention de lecture, non une loi.</text>
<text x="450.0" y="370" text-anchor="middle" font-size="11" fill="#64748B">Le kappa dépend aussi de la fréquence du trouble : à faible prévalence, à accord égal, il diminue.</text>

