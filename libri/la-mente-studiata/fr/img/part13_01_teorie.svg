<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="516" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Les principales théories de la conscience</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Ce qu'affirme chacune, où elle la situe, ce qu'elle prédit</text><rect x="20.0" y="96" width="229.5" height="56" rx="8" fill="#0284C7"/>
<text x="134.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Espace de travail global</text>
<text x="134.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Baars ; Dehaene</text>
<rect x="20.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Idée centrale</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">L'information devient</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">consciente quand elle est diffusée</text>
<text x="30.0" y="228" text-anchor="start" font-size="12" fill="#334155">à de nombreux systèmes</text>
<rect x="20.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="260" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Où</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">Réseaux préfrontaux et</text>
<text x="30.0" y="294" text-anchor="start" font-size="12" fill="#334155">pariétaux</text>
<rect x="20.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="326" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Ce qu'elle prédit</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">Ignition soudaine et</text>
<text x="30.0" y="360" text-anchor="start" font-size="12" fill="#334155">soutenue, même à la fin</text>
<text x="30.0" y="376" text-anchor="start" font-size="12" fill="#334155">du stimulus</text>
<rect x="20.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="408" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Objection principale</text>
<text x="30.0" y="426" text-anchor="start" font-size="12" fill="#334155">Explique l'accès plus que</text>
<text x="30.0" y="442" text-anchor="start" font-size="12" fill="#334155">l'expérience</text>
<rect x="263.5" y="96" width="229.5" height="56" rx="8" fill="#059669"/>
<text x="378.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Information intégrée</text>
<text x="378.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Tononi</text>
<rect x="263.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Idée centrale</text>
<text x="273.5" y="196" text-anchor="start" font-size="12" fill="#334155">La conscience correspond au</text>
<text x="273.5" y="212" text-anchor="start" font-size="12" fill="#334155">degré d'intégration</text>
<text x="273.5" y="228" text-anchor="start" font-size="12" fill="#334155">causale du système (Φ)</text>
<rect x="263.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="260" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Où</text>
<text x="273.5" y="278" text-anchor="start" font-size="12" fill="#334155">Aires postérieures du</text>
<text x="273.5" y="294" text-anchor="start" font-size="12" fill="#334155">cortex</text>
<rect x="263.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="326" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Ce qu'elle prédit</text>
<text x="273.5" y="344" text-anchor="start" font-size="12" fill="#334155">Activité intégrée et</text>
<text x="273.5" y="360" text-anchor="start" font-size="12" fill="#334155">soutenue dans les aires</text>
<text x="273.5" y="376" text-anchor="start" font-size="12" fill="#334155">postérieures</text>
<rect x="263.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="408" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Objection principale</text>
<text x="273.5" y="426" text-anchor="start" font-size="12" fill="#334155">Difficile à calculer et à</text>
<text x="273.5" y="442" text-anchor="start" font-size="12" fill="#334155">mettre à l'épreuve</text>
<rect x="507.0" y="96" width="229.5" height="56" rx="8" fill="#D97706"/>
<text x="621.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Traitement récurrent</text>
<text x="621.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Lamme</text>
<rect x="507.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="178" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Idée centrale</text>
<text x="517.0" y="196" text-anchor="start" font-size="12" fill="#334155">L'expérience apparaît quand</text>
<text x="517.0" y="212" text-anchor="start" font-size="12" fill="#334155">l'information revient aux</text>
<text x="517.0" y="228" text-anchor="start" font-size="12" fill="#334155">aires sensorielles</text>
<rect x="507.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="260" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Où</text>
<text x="517.0" y="278" text-anchor="start" font-size="12" fill="#334155">Aires sensorielles, même</text>
<text x="517.0" y="294" text-anchor="start" font-size="12" fill="#334155">sans lobe frontal</text>
<rect x="507.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="326" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Ce qu'elle prédit</text>
<text x="517.0" y="344" text-anchor="start" font-size="12" fill="#334155">Rétroaction présente quand</text>
<text x="517.0" y="360" text-anchor="start" font-size="12" fill="#334155">le stimulus est vu</text>
<rect x="507.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="408" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Objection principale</text>
<text x="517.0" y="426" text-anchor="start" font-size="12" fill="#334155">Distinguer expérience et</text>
<text x="517.0" y="442" text-anchor="start" font-size="12" fill="#334155">compte rendu reste difficile</text>
<rect x="750.5" y="96" width="229.5" height="56" rx="8" fill="#7C3AED"/>
<text x="865.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Ordre supérieur</text>
<text x="865.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Rosenthal ; Lau</text>
<rect x="750.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Idée centrale</text>
<text x="760.5" y="196" text-anchor="start" font-size="12" fill="#334155">Un état est conscient si le</text>
<text x="760.5" y="212" text-anchor="start" font-size="12" fill="#334155">système a une</text>
<text x="760.5" y="228" text-anchor="start" font-size="12" fill="#334155">représentation de l'être</text>
<rect x="750.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="260" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Où</text>
<text x="760.5" y="278" text-anchor="start" font-size="12" fill="#334155">Aires préfrontales</text>
<rect x="750.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="326" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Ce qu'elle prédit</text>
<text x="760.5" y="344" text-anchor="start" font-size="12" fill="#334155">Sans représentation d'</text>
<text x="760.5" y="360" text-anchor="start" font-size="12" fill="#334155">ordre supérieur, aucune</text>
<text x="760.5" y="376" text-anchor="start" font-size="12" fill="#334155">expérience</text>
<rect x="750.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="408" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Objection principale</text>
<text x="760.5" y="426" text-anchor="start" font-size="12" fill="#334155">Exige des capacités que</text>
<text x="760.5" y="442" text-anchor="start" font-size="12" fill="#334155">certains animaux et les nouveau-nés</text>
<text x="760.5" y="458" text-anchor="start" font-size="12" fill="#334155">pourraient ne pas avoir</text>
<text x="500.0" y="494" text-anchor="middle" font-size="12" fill="#64748B">Elles divergent sur des points vérifiables : c'est pourquoi on peut construire une expérience qui les confronte.</text>

</svg>
