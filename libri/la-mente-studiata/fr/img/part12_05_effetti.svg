<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="582" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Tailles d'effet de la psychothérapie psychodynamique</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Revue parapluie de 2023 (Leichsenring et collègues) : valeurs absolues de g</text><line x1="430.0" y1="104" x2="430.0" y2="502" stroke="#94A3B8" stroke-dasharray="5 4"/>
<text x="430.0" y="98" text-anchor="middle" font-size="11" fill="#64748B">petit (0,2)</text>
<line x1="580.0" y1="104" x2="580.0" y2="502" stroke="#94A3B8" stroke-dasharray="5 4"/>
<text x="580.0" y="98" text-anchor="middle" font-size="11" fill="#64748B">moyen (0,5)</text>
<line x1="730.0" y1="104" x2="730.0" y2="502" stroke="#94A3B8" stroke-dasharray="5 4"/>
<text x="730.0" y="98" text-anchor="middle" font-size="11" fill="#64748B">grand (0,8)</text>
<line x1="330" y1="104" x2="330" y2="502" stroke="#334155" stroke-width="2"/>
<text x="40" y="132" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">Par rapport à la liste d'attente</text>
<text x="40" y="150" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">ou à l'absence de traitement</text>
<text x="318" y="183" text-anchor="end" font-size="13" fill="#334155">Dépression</text>
<rect x="330" y="164" width="290.0" height="26" fill="#0284C7"/><text x="612.0" y="182" text-anchor="end" font-size="13" fill="#FFFFFF" font-weight="bold">0,58</text>
<text x="318" y="221" text-anchor="end" font-size="13" fill="#334155">Anxiété</text>
<rect x="330" y="202" width="360.0" height="26" fill="#0284C7"/><text x="682.0" y="220" text-anchor="end" font-size="13" fill="#FFFFFF" font-weight="bold">0,72</text>
<text x="318" y="259" text-anchor="end" font-size="13" fill="#334155">Troubles de la personnalité</text>
<rect x="330" y="240" width="315.0" height="26" fill="#0284C7"/><text x="637.0" y="258" text-anchor="end" font-size="13" fill="#FFFFFF" font-weight="bold">0,63</text>
<text x="318" y="297" text-anchor="end" font-size="13" fill="#334155">Symptômes somatiques</text>
<rect x="330" y="278" width="235.0" height="26" fill="#0284C7"/><text x="557.0" y="296" text-anchor="end" font-size="13" fill="#FFFFFF" font-weight="bold">0,47</text>
<text x="40" y="346" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">Par rapport à d'autres traitements</text>
<text x="40" y="364" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">(par exemple TCC)</text>
<text x="318" y="397" text-anchor="end" font-size="13" fill="#334155">Dépression</text>
<rect x="330" y="378" width="15.0" height="26" fill="#059669"/><text x="353.0" y="396" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">0,03</text>
<text x="318" y="435" text-anchor="end" font-size="13" fill="#334155">Anxiété</text>
<rect x="330" y="416" width="30.0" height="26" fill="#059669"/><text x="368.0" y="434" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">0,06</text>
<text x="318" y="473" text-anchor="end" font-size="13" fill="#334155">Troubles de la personnalité</text>
<rect x="330" y="454" width="20.0" height="26" fill="#059669"/><text x="358.0" y="472" text-anchor="start" font-size="13" fill="#334155" font-weight="bold">0,04</text>
<text x="450.0" y="536" text-anchor="middle" font-size="12" fill="#334155">Par rapport aux contrôles, les effets sont modérés à grands ; entre approches crédibles, les différences sont proches de zéro.</text>
<text x="450.0" y="558" text-anchor="middle" font-size="11" fill="#64748B">Seuils de Cohen (0,2 ; 0,5 ; 0,8) comme référence conventionnelle. Les études ne sont qu'en partie en aveugle.</text>

</svg>
