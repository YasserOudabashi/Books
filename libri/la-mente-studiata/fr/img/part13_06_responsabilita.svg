<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="382" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Trois réponses sur la responsabilité</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Présentées comme les soutiendrait qui les défend ; les données ne tranchent pas entre elles</text><rect x="20.0" y="96" width="310.6666666666667" height="56" rx="8" fill="#0284C7"/>
<text x="175.33333333333334" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Sensibilité aux raisons</text>
<text x="175.33333333333334" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Compatibilisme ; Strawson</text>
<rect x="20.0" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Sur quoi elle repose</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">Sur la capacité d'agir pour des raisons et</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">de changer en fonction de celles-ci</text>
<rect x="20.0" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="244" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">But de la réponse</text>
<text x="30.0" y="262" text-anchor="start" font-size="12" fill="#334155">Attribuer mérite et blâme comme pratique</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">entre personnes</text>
<rect x="20.0" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="310" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Objection principale</text>
<text x="30.0" y="328" text-anchor="start" font-size="12" fill="#334155">Pourquoi la sensibilité aux raisons</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">suffirait-elle pour une pleine culpabilité ?</text>
<rect x="344.6666666666667" y="96" width="310.6666666666667" height="56" rx="8" fill="#059669"/>
<text x="500.0" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Conséquences</text>
<text x="500.0" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Conséquentialisme</text>
<rect x="344.6666666666667" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Sur quoi elle repose</text>
<text x="354.6666666666667" y="196" text-anchor="start" font-size="12" fill="#334155">Sur les effets de la sanction :</text>
<text x="354.6666666666667" y="212" text-anchor="start" font-size="12" fill="#334155">dissuasion, protection, réhabilitation</text>
<rect x="344.6666666666667" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="244" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">But de la réponse</text>
<text x="354.6666666666667" y="262" text-anchor="start" font-size="12" fill="#334155">Réduire le préjudice futur avec les</text>
<text x="354.6666666666667" y="278" text-anchor="start" font-size="12" fill="#334155">moyens les plus efficaces</text>
<rect x="344.6666666666667" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="310" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Objection principale</text>
<text x="354.6666666666667" y="328" text-anchor="start" font-size="12" fill="#334155">Pourrait justifier de punir un</text>
<text x="354.6666666666667" y="344" text-anchor="start" font-size="12" fill="#334155">innocent si c'est utile</text>
<rect x="669.3333333333334" y="96" width="310.6666666666667" height="56" rx="8" fill="#7C3AED"/>
<text x="824.6666666666667" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Sans culpabilité rétributive</text>
<text x="824.6666666666667" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Pereboom ; Caruso ; Sapolsky</text>
<rect x="669.3333333333334" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Sur quoi elle repose</text>
<text x="679.3333333333334" y="196" text-anchor="start" font-size="12" fill="#334155">Sur le fait que nul n'est source ultime</text>
<text x="679.3333333333334" y="212" text-anchor="start" font-size="12" fill="#334155">de ses propres actions</text>
<rect x="669.3333333333334" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="244" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">But de la réponse</text>
<text x="679.3333333333334" y="262" text-anchor="start" font-size="12" fill="#334155">Protéger les autres, avec un minimum de</text>
<text x="679.3333333333334" y="278" text-anchor="start" font-size="12" fill="#334155">souffrance, et agir sur les causes</text>
<rect x="669.3333333333334" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="310" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Objection principale</text>
<text x="679.3333333333334" y="328" text-anchor="start" font-size="12" fill="#334155">Risque de traiter les personnes comme</text>
<text x="679.3333333333334" y="344" text-anchor="start" font-size="12" fill="#334155">des objets à gérer</text>

</svg>
