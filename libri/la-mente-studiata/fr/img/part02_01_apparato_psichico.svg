<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le modèle structural : Ça, Moi, Surmoi</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Trois instances en tension réciproque, pas trois lieux physiques du cerveau</text>

  <!-- Es -->
  <circle cx="270" cy="260" r="130" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="270" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#991B1B">Ça (id)</text>
  <text x="270" y="255" text-anchor="middle" font-size="12" fill="#7F1D1D">pulsions et désirs</text>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#7F1D1D">non filtrés</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#991B1B">principe de plaisir</text>

  <!-- Super-io -->
  <circle cx="630" cy="260" r="130" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="630" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A8A">Surmoi (superego)</text>
  <text x="630" y="255" text-anchor="middle" font-size="12" fill="#1E40AF">normes et interdits</text>
  <text x="630" y="272" text-anchor="middle" font-size="12" fill="#1E40AF">intériorisés</text>
  <text x="630" y="292" text-anchor="middle" font-size="11" fill="#1E3A8A">jugement, censure morale</text>

  <!-- Io overlap -->
  <circle cx="450" cy="260" r="100" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5" opacity="0.92"/>
  <text x="450" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532D">Moi (ego)</text>
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#166534">médiation entre pulsions,</text>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#166534">normes et réalité externe</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#14532D">principe de réalité</text>

  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#334155">Une grande part de la vie psychique quotidienne est décrite comme un compromis continu</text>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#334155">entre les pressions du Ça, les contraintes du Surmoi et les limites imposées par la réalité.</text>
  <text x="450" y="495" text-anchor="middle" font-size="12" fill="#94A3B8">Appliqué au rêve (chap. 9) et au délire (chap. 12).</text>
</svg>
