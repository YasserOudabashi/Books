<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="440" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Corrélation, cause et variable confondante</text>

  <!-- Case 1: direct causation -->
  <text x="160" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">Possibilité 1</text>
  <rect x="60" y="100" width="140" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" font-size="13" fill="#334155">Heures de sommeil</text>
  <line x1="200" y1="125" x2="260" y2="125" stroke="#059669" stroke-width="2" marker-end="url(#arrowg)"/>
  <rect x="260" y="100" width="140" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="330" y="130" text-anchor="middle" font-size="13" fill="#334155">Mémoire</text>

  <!-- Case 2: reverse causation -->
  <text x="160" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">Possibilité 2</text>
  <rect x="60" y="220" width="140" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="130" y="250" text-anchor="middle" font-size="13" fill="#334155">Heures de sommeil</text>
  <line x1="260" y1="245" x2="200" y2="245" stroke="#059669" stroke-width="2" marker-end="url(#arrowg)"/>
  <rect x="260" y="220" width="140" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="330" y="250" text-anchor="middle" font-size="13" fill="#334155">Mémoire</text>

  <!-- Case 3: confound -->
  <text x="620" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">Possibilité 3</text>
  <rect x="530" y="100" width="180" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="620" y="130" text-anchor="middle" font-size="13" fill="#334155">Stress (confondante)</text>
  <line x1="600" y1="150" x2="530" y2="230" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowr)"/>
  <line x1="650" y1="150" x2="720" y2="230" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="440" y="230" width="150" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="515" y="260" text-anchor="middle" font-size="13" fill="#334155">Heures de sommeil</text>
  <rect x="660" y="230" width="150" height="50" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="735" y="260" text-anchor="middle" font-size="13" fill="#334155">Mémoire</text>
  <line x1="590" y1="255" x2="660" y2="255" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="625" y="245" text-anchor="middle" font-size="11" fill="#64748B">corrélées, pas cause</text>

  <rect x="60" y="340" width="750" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="435" y="368" text-anchor="middle" font-size="14" fill="#334155">Un coefficient r = 0,45 est compatible avec les trois possibilités.</text>
  <text x="435" y="390" text-anchor="middle" font-size="14" fill="#334155">Seule l'expérience contrôlée (chapitre 2) peut les départager.</text>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/>
    </marker>
  </defs>
</svg>
