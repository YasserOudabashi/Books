<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Relativité linguistique : le cas du bleu</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Le russe distingue grammaticalement goluboy (bleu clair) et siniy (bleu foncé)</text>

  <rect x="100" y="110" width="300" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="250" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Locuteurs russes</text>
  <text x="250" y="160" text-anchor="middle" font-size="11" fill="#1E40AF">deux catégories de base :</text>
  <text x="250" y="180" text-anchor="middle" font-size="11" fill="#1E40AF">goluboy / siniy</text>
  <text x="250" y="205" text-anchor="middle" font-size="11" fill="#1E40AF">discrimination plus rapide</text>
  <text x="250" y="223" text-anchor="middle" font-size="11" fill="#1E40AF">quand les couleurs traversent</text>
  <text x="250" y="240" text-anchor="middle" font-size="11" fill="#1E40AF">la frontière entre les deux catégories</text>

  <rect x="500" y="110" width="300" height="140" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="650" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Locuteurs anglais</text>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#334155">une seule catégorie : « blue »</text>
  <text x="650" y="185" text-anchor="middle" font-size="11" fill="#334155">aucun avantage de vitesse</text>
  <text x="650" y="205" text-anchor="middle" font-size="11" fill="#334155">au même seuil chromatique</text>

  <rect x="230" y="290" width="440" height="90" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="450" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">L'avantage disparaît avec une tâche verbale concurrente</text>
  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#991B1B">signe que l'effet passe par une représentation</text>
  <text x="450" y="353" text-anchor="middle" font-size="11" fill="#991B1B">linguistique active, non une différence perceptive fixe</text>

  <rect x="180" y="400" width="540" height="45" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#92400E">Effet réel mais petit et spécifique à la tâche, pas un déterminisme linguistique</text>
</svg>
