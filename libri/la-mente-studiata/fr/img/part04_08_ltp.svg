<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le récepteur NMDA comme détecteur de coïncidences</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Le calcium n'entre que si pré- et postsynaptique sont actifs ensemble</text>

  <!-- presynaptic -->
  <rect x="80" y="150" width="200" height="100" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="180" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Terminaison</text>
  <text x="180" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">présynaptique</text>
  <text x="180" y="225" text-anchor="middle" font-size="11" fill="#475569">libère du glutamate</text>

  <line x1="280" y1="200" x2="360" y2="200" stroke="#059669" stroke-width="3" marker-end="url(#a10)"/>
  <text x="320" y="185" text-anchor="middle" font-size="10" fill="#059669">glutamate</text>

  <!-- postsynaptic with NMDA and AMPA -->
  <rect x="360" y="130" width="280" height="200" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Membrane postsynaptique</text>

  <rect x="390" y="180" width="90" height="60" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="435" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">NMDA</text>
  <text x="435" y="222" text-anchor="middle" font-size="9" fill="#7F1D1D">bloqué par Mg²⁺</text>

  <rect x="510" y="180" width="90" height="60" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="555" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">AMPA</text>
  <text x="555" y="222" text-anchor="middle" font-size="9" fill="#1E40AF">dépolarise</text>

  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#334155">Condition 1 : glutamate lié (NMDA)</text>
  <text x="500" y="288" text-anchor="middle" font-size="11" fill="#334155">Condition 2 : dépolarisation déjà en cours (via AMPA)</text>
  <text x="500" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">→ seulement ensemble : Mg²⁺ expulsé, Ca²⁺ entre</text>

  <line x1="500" y1="330" x2="500" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#a10)"/>

  <rect x="330" y="380" width="340" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="500" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Ca²⁺ active CaMKII</text>
  <text x="500" y="425" text-anchor="middle" font-size="11" fill="#166534">→ plus de récepteurs AMPA insérés</text>
  <text x="500" y="443" text-anchor="middle" font-size="11" fill="#166534">→ synapse renforcée (PLT)</text>
  <text x="500" y="461" text-anchor="middle" font-size="10" fill="#166534">phase tardive : CREB, nouvelles synapses (jours-semaines)</text>

  <defs>
    <marker id="a10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
