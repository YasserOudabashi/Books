<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">La courbe en U inversé (Yerkes-Dodson)</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Performance en fonction du niveau d'activation lié au stress</text>

  <line x1="120" y1="380" x2="800" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="380" x2="120" y2="100" stroke="#334155" stroke-width="2"/>
  <text x="460" y="410" text-anchor="middle" font-size="12" fill="#334155">niveau d'activation lié au stress</text>
  <text x="70" y="240" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 70 240)">performance</text>

  <path d="M 140,360 C 300,150 400,130 460,130 C 520,130 620,150 780,350" fill="none" stroke="#059669" stroke-width="3"/>

  <text x="200" y="330" font-size="11" fill="#334155">ennui,</text>
  <text x="200" y="345" font-size="11" fill="#334155">faible motivation</text>

  <text x="420" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">niveau optimal (eustress)</text>

  <text x="650" y="330" font-size="11" fill="#334155">surcharge,</text>
  <text x="650" y="345" font-size="11" fill="#334155">détresse</text>

  <rect x="150" y="435" width="600" height="35" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#92400E">Seuls les extrêmes de la courbe produisent les conséquences négatives du stress</text>
</svg>
