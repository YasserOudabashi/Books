<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="530" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Combien signalent la crise</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Pourcentage de participants selon le nombre d'autres témoins crus présents</text><line x1="150" y1="400" x2="690" y2="400" stroke="#334155" stroke-width="2"/><line x1="150" y1="400" x2="150" y2="140" stroke="#334155" stroke-width="2"/>
<text x="140" y="404.0" text-anchor="end" font-size="11" fill="#334155">0</text><line x1="150" y1="400.0" x2="690" y2="400.0" stroke="#E2E8F0"/>
<text x="140" y="352.0" text-anchor="end" font-size="11" fill="#334155">20</text><line x1="150" y1="348.0" x2="690" y2="348.0" stroke="#E2E8F0"/>
<text x="140" y="300.0" text-anchor="end" font-size="11" fill="#334155">40</text><line x1="150" y1="296.0" x2="690" y2="296.0" stroke="#E2E8F0"/>
<text x="140" y="248.0" text-anchor="end" font-size="11" fill="#334155">60</text><line x1="150" y1="244.0" x2="690" y2="244.0" stroke="#E2E8F0"/>
<text x="140" y="196.0" text-anchor="end" font-size="11" fill="#334155">80</text><line x1="150" y1="192.0" x2="690" y2="192.0" stroke="#E2E8F0"/>
<text x="140" y="144.0" text-anchor="end" font-size="11" fill="#334155">100</text><line x1="150" y1="140.0" x2="690" y2="140.0" stroke="#E2E8F0"/>
<rect x="190.5" y="179.0" width="99.00000000000001" height="221.0" fill="#059669"/><text x="240.0" y="171.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">85%</text>
<text x="240.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Seuls</text>
<text x="240.0" y="435" text-anchor="middle" font-size="12" fill="#334155">(seulement la victime)</text>
<rect x="370.5" y="238.8" width="99.00000000000001" height="161.2" fill="#D97706"/><text x="420.0" y="230.8" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">62%</text>
<text x="420.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Un autre</text>
<text x="420.0" y="435" text-anchor="middle" font-size="12" fill="#334155">témoin</text>
<rect x="550.5" y="319.4" width="99.00000000000001" height="80.6" fill="#DC2626"/><text x="600.0" y="311.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">31%</text>
<text x="600.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Quatre autres</text>
<text x="600.0" y="435" text-anchor="middle" font-size="12" fill="#334155">témoins</text>
<text x="450" y="462" text-anchor="middle" font-size="13" fill="#334155">Si les individus décidaient indépendamment, avec p = 0,31 pour chacun des cinq témoins,</text><text x="450" y="482" text-anchor="middle" font-size="13" fill="#334155">au moins un agirait avec une probabilité de 1 − 0,69⁵ ≈ 0,84 : l'indépendance est justement ce qu'on met en doute.</text><text x="450" y="506" text-anchor="middle" font-size="11" fill="#64748B">Valeurs citées dans la littérature (Darley et Latané, 1968).</text>
</svg>
