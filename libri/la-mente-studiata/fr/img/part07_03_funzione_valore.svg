<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">La fonction de valeur de la théorie des perspectives</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Concave pour les gains, convexe et plus raide pour les pertes</text>

  <!-- axes -->
  <line x1="120" y1="270" x2="820" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="470" y1="100" x2="470" y2="440" stroke="#334155" stroke-width="2"/>
  <text x="800" y="290" text-anchor="middle" font-size="12" fill="#334155">gains/pertes (x)</text>
  <text x="470" y="95" text-anchor="middle" font-size="12" fill="#334155">valeur v(x)</text>

  <!-- gain curve (concave) -->
  <path d="M 470,270 C 550,220 650,170 820,140" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="700" y="170" font-size="12" fill="#065F46" font-weight="bold">gains : v(x) = x^0,88</text>

  <!-- loss curve (convex, steeper) -->
  <path d="M 470,270 C 400,340 300,400 120,430" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="180" y="400" font-size="12" fill="#7F1D1D" font-weight="bold">pertes : v(x) = −2,25·(−x)^0,88</text>

  <!-- markers at 100 -->
  <circle cx="560" cy="216" r="5" fill="#059669"/>
  <text x="565" y="205" font-size="10" fill="#065F46">v(100)≈57,5</text>
  <circle cx="380" cy="352" r="5" fill="#DC2626"/>
  <text x="200" y="385" font-size="10" fill="#7F1D1D">v(−100)≈−129,5</text>

  <rect x="180" y="455" width="540" height="35" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="478" text-anchor="middle" font-size="11" fill="#92400E">Une perte pèse plus du double d'un gain de même ampleur</text>
</svg>
