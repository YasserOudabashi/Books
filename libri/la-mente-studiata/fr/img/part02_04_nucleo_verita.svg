<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le « noyau de vérité » dans le délire</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Pourquoi l'argument rationnel suffit souvent mal à ébranler une conviction délirante</text>

  <!-- true element (hidden) -->
  <circle cx="260" cy="240" r="90" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="260" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">Élément vrai</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#7F1D1D">refoulé, inacceptable</text>
  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#991B1B">(caché)</text>

  <!-- arrow of displacement -->
  <path d="M 350 240 C 450 180, 500 180, 600 230" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="475" y="175" text-anchor="middle" font-size="12" fill="#334155">charge de conviction</text>
  <text x="475" y="192" text-anchor="middle" font-size="12" fill="#334155">déplacée ici</text>

  <!-- false substitute (conscious) -->
  <circle cx="650" cy="240" r="90" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="650" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">Substitut conscient</text>
  <text x="650" y="245" text-anchor="middle" font-size="11" fill="#1E40AF">faux, mais tolérable</text>
  <text x="650" y="263" text-anchor="middle" font-size="10" fill="#1E3A8A">(visible, le délire même)</text>

  <!-- argument arrow hitting wrong target -->
  <line x1="650" y1="360" x2="650" y2="332" stroke="#D97706" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="650" y="390" text-anchor="middle" font-size="12" fill="#92400E">l'argument rationnel</text>
  <text x="650" y="408" text-anchor="middle" font-size="12" fill="#92400E">frappe ici...</text>
  <text x="260" y="390" text-anchor="middle" font-size="12" fill="#64748B">...mais la conviction</text>
  <text x="260" y="408" text-anchor="middle" font-size="12" fill="#64748B">a ses racines là</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D97706"/>
    </marker>
  </defs>
</svg>
