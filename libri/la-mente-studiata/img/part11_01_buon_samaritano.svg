<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="510" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il buon samaritano</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Percentuale di seminaristi che si fermarono ad aiutare, per condizione di tempo</text><line x1="150" y1="400" x2="750" y2="400" stroke="#334155" stroke-width="2"/><line x1="150" y1="400" x2="150" y2="140" stroke="#334155" stroke-width="2"/>
<text x="140" y="404.0" text-anchor="end" font-size="11" fill="#334155">0</text><line x1="150" y1="400.0" x2="750" y2="400.0" stroke="#E2E8F0"/>
<text x="140" y="352.0" text-anchor="end" font-size="11" fill="#334155">20</text><line x1="150" y1="348.0" x2="750" y2="348.0" stroke="#E2E8F0"/>
<text x="140" y="300.0" text-anchor="end" font-size="11" fill="#334155">40</text><line x1="150" y1="296.0" x2="750" y2="296.0" stroke="#E2E8F0"/>
<text x="140" y="248.0" text-anchor="end" font-size="11" fill="#334155">60</text><line x1="150" y1="244.0" x2="750" y2="244.0" stroke="#E2E8F0"/>
<text x="140" y="196.0" text-anchor="end" font-size="11" fill="#334155">80</text><line x1="150" y1="192.0" x2="750" y2="192.0" stroke="#E2E8F0"/>
<text x="140" y="144.0" text-anchor="end" font-size="11" fill="#334155">100</text><line x1="150" y1="140.0" x2="750" y2="140.0" stroke="#E2E8F0"/>
<rect x="217.5" y="374.0" width="165.0" height="26.0" fill="#DC2626"/><text x="300.0" y="366.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">10%</text>
<text x="300.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Forte fretta</text>
<text x="300.0" y="435" text-anchor="middle" font-size="12" fill="#334155">(si crede in ritardo)</text>
<rect x="517.5" y="236.2" width="165.0" height="163.8" fill="#059669"/><text x="600.0" y="228.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">63%</text>
<text x="600.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Nessuna fretta</text>
<text x="600.0" y="435" text-anchor="middle" font-size="12" fill="#334155">(tempo a disposizione)</text>
<text x="450" y="462" text-anchor="middle" font-size="13" fill="#334155">Rapporto tra odds (odds ratio) circa 15. Il tema del discorso non proteggeva dall'effetto del tempo.</text><text x="450" y="484" text-anchor="middle" font-size="11" fill="#64748B">Valori citati dalla letteratura (Darley e Batson, 1973); campione piccolo.</text>
</svg>
