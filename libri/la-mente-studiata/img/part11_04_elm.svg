<svg xmlns="http://www.w3.org/2000/svg" width="900" height="525" viewBox="0 0 900 525" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="525" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il modello della probabilità di elaborazione</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Due vie con cui un messaggio può cambiare un atteggiamento</text><rect x="60" y="230" width="170" height="80" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="2.5"/><text x="145.0" y="267.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Messaggio</text><text x="145.0" y="286.0" text-anchor="middle" font-size="12" fill="#334155">(argomenti e indizi)</text>
<rect x="320" y="230" width="210" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="425.0" y="267.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Motivazione e capacità</text><text x="425.0" y="286.0" text-anchor="middle" font-size="12" fill="#334155">alte o basse?</text>
<line x1="230" y1="270" x2="320" y2="270" stroke="#334155" stroke-width="2.5"/>
<rect x="620" y="110" width="230" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/><text x="735.0" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Via centrale</text><text x="735.0" y="176.0" text-anchor="middle" font-size="12" fill="#334155">si valutano gli argomenti</text>
<rect x="620" y="330" width="230" height="100" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/><text x="735.0" y="377.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Via periferica</text><text x="735.0" y="396.0" text-anchor="middle" font-size="12" fill="#334155">contano gli indizi</text>
<line x1="530" y1="255" x2="620" y2="175" stroke="#334155" stroke-width="2.5"/>
<line x1="530" y1="285" x2="620" y2="375" stroke="#334155" stroke-width="2.5"/>
<text x="535" y="200" font-size="12" font-weight="bold" fill="#059669">alte</text><text x="528" y="352" font-size="12" font-weight="bold" fill="#0284C7">basse</text><text x="735" y="240" text-anchor="middle" font-size="12" fill="#334155">atteggiamento più durevole</text><text x="735" y="258" text-anchor="middle" font-size="12" fill="#334155">e più predittivo del comportamento</text><text x="735" y="455" text-anchor="middle" font-size="12" fill="#334155">atteggiamento più temporaneo</text><text x="450" y="500" text-anchor="middle" font-size="11" fill="#64748B">Schema concettuale (Petty e Cacioppo, 1986). Il modello è discusso: l'unimodello propone un solo processo.</text>
</svg>
