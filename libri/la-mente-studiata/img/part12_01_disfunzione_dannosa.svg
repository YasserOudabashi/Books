<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="540" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Disfunzione dannosa</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Due componenti distinte: una di fatto (disfunzione) e una di valore (danno)</text><text x="390.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Nessuna disfunzione</text>
<text x="710.0" y="112" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Disfunzione</text>
<text x="216" y="220.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">Danno</text>
<text x="216" y="370.0" text-anchor="end" font-size="14" fill="#334155" font-weight="bold">Nessun danno</text>
<rect x="234" y="144" width="312" height="142" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
<text x="390.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Sofferenza senza disturbo</text>
<text x="390.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">Dolore intenso dopo una perdita:</text>
<text x="390.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">il meccanismo funziona come previsto</text>
<rect x="554" y="144" width="312" height="142" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
<text x="710.0" y="201.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Disturbo</text>
<text x="710.0" y="225.0" text-anchor="middle" font-size="12" fill="#334155">Il cuore che non pompa il sangue;</text>
<text x="710.0" y="243.0" text-anchor="middle" font-size="12" fill="#334155">per la mente: disfunzione e danno insieme</text>
<rect x="234" y="294" width="312" height="142" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
<text x="390.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Nessun disturbo</text>
<text x="390.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Variazione normale</text>
<text x="390.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">tra le persone</text>
<rect x="554" y="294" width="312" height="142" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5"/>
<text x="710.0" y="351.0" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">Disfunzione senza danno</text>
<text x="710.0" y="375.0" text-anchor="middle" font-size="12" fill="#334155">Inversione speculare degli organi</text>
<text x="710.0" y="393.0" text-anchor="middle" font-size="12" fill="#334155">(situs inversus), di norma innocua</text>
<text x="450.0" y="474" text-anchor="middle" font-size="13" fill="#334155">Solo dove le due componenti coincidono si ha un disturbo (Wakefield, 1992).</text>
<text x="450.0" y="496" text-anchor="middle" font-size="11" fill="#64748B">La proposta è discussa: le funzioni evolutive dei meccanismi mentali sono spesso ipotesi.</text>

</svg>
