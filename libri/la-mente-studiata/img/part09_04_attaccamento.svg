  <line x1="120" y1="380" x2="120" y2="104" stroke="#334155" stroke-width="2"/>
  <text x="108" y="384" text-anchor="end" font-size="11" fill="#334155">0</text>
  <text x="108" y="292" text-anchor="end" font-size="11" fill="#334155">20</text>
