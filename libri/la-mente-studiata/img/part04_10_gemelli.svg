<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il disegno dello studio sui gemelli</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Confrontare le somiglianze di due tipi di coppie per stimare l'ereditabilità</text>

  <!-- MZ twins -->
  <rect x="80" y="100" width="330" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="245" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Gemelli monozigoti (MZ)</text>
  <text x="245" y="145" text-anchor="middle" font-size="11" fill="#1E40AF">DNA condiviso: ~100%</text>
  <circle cx="170" cy="190" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="320" cy="190" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <line x1="200" y1="190" x2="290" y2="190" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="245" y="240" text-anchor="middle" font-size="12" fill="#1E3A8A">correlazione osservata: r_MZ</text>

  <!-- DZ twins -->
  <rect x="490" y="100" width="330" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="655" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">Gemelli dizigoti (DZ)</text>
  <text x="655" y="145" text-anchor="middle" font-size="11" fill="#166534">DNA condiviso: ~50%, come fratelli comuni</text>
  <circle cx="580" cy="190" r="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <circle cx="730" cy="190" r="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <line x1="610" y1="190" x2="700" y2="190" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="655" y="240" text-anchor="middle" font-size="12" fill="#14532D">correlazione osservata: r_DZ</text>

  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#334155">Logica: se il tratto è influenzato dai geni, i gemelli MZ (identici) dovrebbero somigliarsi</text>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#334155">più dei DZ — a parità, in teoria, di ambiente condiviso.</text>

  <!-- formula box -->
  <rect x="230" y="350" width="440" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">h² = 2 × (r_MZ − r_DZ)</text>
  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#92400E">Esempio: r_MZ = 0,70, r_DZ = 0,40</text>
  <text x="450" y="423" text-anchor="middle" font-size="11" fill="#92400E">h² = 2 × (0,70 − 0,40) = 0,60</text>
  <text x="450" y="443" text-anchor="middle" font-size="10" fill="#92400E">stima valida solo sotto l'assunzione dell'ambiente equivalente</text>

  <text x="450" y="495" text-anchor="middle" font-size="11" fill="#94A3B8">L'ereditabilità è una proprietà della popolazione studiata, non un destino individuale.</text>
</svg>
