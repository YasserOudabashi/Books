<text x="670" y="296" text-anchor="middle" font-size="11" fill="#64748B">tempo (secondi, esempio inventato)</text>
<line x1="450" y1="221" x2="514" y2="221" stroke="#64748B" stroke-width="2"/>
<text x="670" y="190" text-anchor="middle" font-size="12" fill="#334155">A = strisce verticali; B = strisce orizzontali</text>
<text x="670" y="208" text-anchor="middle" font-size="10" fill="#334155"></text>
<text x="450.0" y="400" text-anchor="middle" font-size="12" fill="#334155">Qualunque differenza di attività cerebrale al momento del cambio non può dipendere da una variazione dello stimolo.</text>
<text x="450.0" y="422" text-anchor="middle" font-size="11" fill="#64748B">Ma la misura del percetto è un resoconto: contiene anche la decisione di riferirlo.</text>

