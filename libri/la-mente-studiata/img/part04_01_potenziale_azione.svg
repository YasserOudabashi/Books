<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le fasi del potenziale d'azione</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Tensione di membrana nel tempo</text>

  <!-- axes -->
  <line x1="100" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="100" y1="80" x2="100" y2="420" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#334155">Tempo (millisecondi)</text>
  <text x="55" y="250" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 55 250)">Tensione (mV)</text>

  <!-- reference lines -->
  <line x1="100" y1="330" x2="800" y2="330" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="95" y="334" text-anchor="end" font-size="11" fill="#64748B">-70 (riposo)</text>
  <line x1="100" y1="300" x2="800" y2="300" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="95" y="304" text-anchor="end" font-size="11" fill="#92400E">-55 (soglia)</text>
  <line x1="100" y1="110" x2="800" y2="110" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="95" y="114" text-anchor="end" font-size="11" fill="#64748B">+40</text>

  <!-- action potential curve -->
  <path d="M 100,330 L 300,330 C 340,330 350,300 370,290 C 400,270 410,150 430,110 C 450,90 460,100 480,150 C 500,200 510,340 530,360 C 550,375 570,335 600,330 L 800,330"
        fill="none" stroke="#DC2626" stroke-width="3"/>

  <!-- phase labels -->
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="bold">Salita (Na⁺ entra)</text>
  <text x="500" y="230" text-anchor="middle" font-size="12" fill="#0284C7" font-weight="bold">Discesa (K⁺ esce)</text>
  <text x="560" y="390" text-anchor="middle" font-size="11" fill="#334155">Iperpolarizzazione /</text>
  <text x="560" y="405" text-anchor="middle" font-size="11" fill="#334155">periodo refrattario</text>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#334155">Picco (~+40 mV)</text>

  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#94A3B8">Sopra soglia, l'evento procede sempre allo stesso modo: tutto-o-nulla.</text>
</svg>
