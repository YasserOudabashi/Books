<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Vulnerabilità e stress: un'interazione</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Esempio inventato per illustrare il calcolo del rischio atteso</text><line x1="150" y1="400" x2="710" y2="400" stroke="#334155" stroke-width="2"/><line x1="150" y1="400" x2="150" y2="140" stroke="#334155" stroke-width="2"/>
<text x="140" y="404.0" text-anchor="end" font-size="11" fill="#334155">0</text>
<line x1="150" y1="400.0" x2="710" y2="400.0" stroke="#E2E8F0"/>
<text x="140" y="339.0" text-anchor="end" font-size="11" fill="#334155">10</text>
<line x1="150" y1="335.0" x2="710" y2="335.0" stroke="#E2E8F0"/>
<text x="140" y="274.0" text-anchor="end" font-size="11" fill="#334155">20</text>
<line x1="150" y1="270.0" x2="710" y2="270.0" stroke="#E2E8F0"/>
<text x="140" y="209.0" text-anchor="end" font-size="11" fill="#334155">30</text>
<line x1="150" y1="205.0" x2="710" y2="205.0" stroke="#E2E8F0"/>
<text x="140" y="144.0" text-anchor="end" font-size="11" fill="#334155">40</text>
<line x1="150" y1="140.0" x2="710" y2="140.0" stroke="#E2E8F0"/>
<rect x="181.5" y="367.5" width="77.0" height="32.5" fill="#64748B"/><text x="220.0" y="359.5" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">5%</text>
<text x="220.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Nessuno dei due</text>
<text x="220.0" y="435" text-anchor="middle" font-size="12" fill="#334155">(rischio di base)</text>
<rect x="321.5" y="361.0" width="77.0" height="39.0" fill="#0284C7"/><text x="360.0" y="353.0" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">6%</text>
<text x="360.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Solo vulnerabilità</text>
<rect x="461.5" y="335.0" width="77.0" height="65.0" fill="#D97706"/><text x="500.0" y="327.0" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">10%</text>
<text x="500.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Solo stress</text>
<rect x="601.5" y="205.0" width="77.0" height="195.0" fill="#DC2626"/><text x="640.0" y="197.0" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">30%</text>
<text x="640.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Vulnerabilità</text>
<text x="640.0" y="435" text-anchor="middle" font-size="12" fill="#334155">e stress</text>
<line x1="589.5" y1="322.0" x2="690.5" y2="322.0" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="730" y="326.0" text-anchor="start" font-size="12" fill="#334155">atteso se i due</text>
<text x="730" y="342.0" text-anchor="start" font-size="12" fill="#334155">fattori fossero</text>
<text x="730" y="358.0" text-anchor="start" font-size="12" fill="#334155" font-weight="bold">indipendenti: 12%</text>
<text x="450.0" y="470" text-anchor="middle" font-size="12" fill="#334155">Rischio relativo della vulnerabilità 1,2; dello stress 2,0; atteso 5% × 1,2 × 2,0 = 12%; osservato 30%.</text>
<text x="450.0" y="492" text-anchor="middle" font-size="11" fill="#64748B">Valori inventati: servono a mostrare come si distingue la somma dall'interazione.</text>

</svg>
