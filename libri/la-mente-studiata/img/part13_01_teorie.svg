<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="516" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Le teorie principali della coscienza</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Che cosa afferma ciascuna, dove la colloca, che cosa prevede</text><rect x="20.0" y="96" width="229.5" height="56" rx="8" fill="#0284C7"/>
<text x="134.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Spazio di lavoro globale</text>
<text x="134.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Baars; Dehaene</text>
<rect x="20.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Idea centrale</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">L'informazione diventa</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">cosciente quando è diffusa</text>
<text x="30.0" y="228" text-anchor="start" font-size="12" fill="#334155">a molti sistemi</text>
<rect x="20.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="260" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Dove</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">Reti prefrontali e</text>
<text x="30.0" y="294" text-anchor="start" font-size="12" fill="#334155">parietali</text>
<rect x="20.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="326" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Che cosa prevede</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">Ignizione improvvisa e</text>
<text x="30.0" y="360" text-anchor="start" font-size="12" fill="#334155">sostenuta, anche alla fine</text>
<text x="30.0" y="376" text-anchor="start" font-size="12" fill="#334155">dello stimolo</text>
<rect x="20.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="408" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Obiezione principale</text>
<text x="30.0" y="426" text-anchor="start" font-size="12" fill="#334155">Spiega l'accesso più che</text>
<text x="30.0" y="442" text-anchor="start" font-size="12" fill="#334155">l'esperienza</text>
<rect x="263.5" y="96" width="229.5" height="56" rx="8" fill="#059669"/>
<text x="378.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Informazione integrata</text>
<text x="378.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Tononi</text>
<rect x="263.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Idea centrale</text>
<text x="273.5" y="196" text-anchor="start" font-size="12" fill="#334155">La coscienza corrisponde al</text>
<text x="273.5" y="212" text-anchor="start" font-size="12" fill="#334155">grado di integrazione</text>
<text x="273.5" y="228" text-anchor="start" font-size="12" fill="#334155">causale del sistema (Φ)</text>
<rect x="263.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="260" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Dove</text>
<text x="273.5" y="278" text-anchor="start" font-size="12" fill="#334155">Aree posteriori della</text>
<text x="273.5" y="294" text-anchor="start" font-size="12" fill="#334155">corteccia</text>
<rect x="263.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="326" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Che cosa prevede</text>
<text x="273.5" y="344" text-anchor="start" font-size="12" fill="#334155">Attività integrata e</text>
<text x="273.5" y="360" text-anchor="start" font-size="12" fill="#334155">sostenuta nelle aree</text>
<text x="273.5" y="376" text-anchor="start" font-size="12" fill="#334155">posteriori</text>
<rect x="263.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="273.5" y="408" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Obiezione principale</text>
<text x="273.5" y="426" text-anchor="start" font-size="12" fill="#334155">Difficile da calcolare e da</text>
<text x="273.5" y="442" text-anchor="start" font-size="12" fill="#334155">mettere alla prova</text>
<rect x="507.0" y="96" width="229.5" height="56" rx="8" fill="#D97706"/>
<text x="621.75" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Elaborazione ricorrente</text>
<text x="621.75" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Lamme</text>
<rect x="507.0" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="178" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Idea centrale</text>
<text x="517.0" y="196" text-anchor="start" font-size="12" fill="#334155">L'esperienza compare quando</text>
<text x="517.0" y="212" text-anchor="start" font-size="12" fill="#334155">l'informazione ritorna alle</text>
<text x="517.0" y="228" text-anchor="start" font-size="12" fill="#334155">aree sensoriali</text>
<rect x="507.0" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="260" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Dove</text>
<text x="517.0" y="278" text-anchor="start" font-size="12" fill="#334155">Aree sensoriali, anche</text>
<text x="517.0" y="294" text-anchor="start" font-size="12" fill="#334155">senza lobo frontale</text>
<rect x="507.0" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="326" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Che cosa prevede</text>
<text x="517.0" y="344" text-anchor="start" font-size="12" fill="#334155">Retroazione presente quando</text>
<text x="517.0" y="360" text-anchor="start" font-size="12" fill="#334155">lo stimolo è visto</text>
<rect x="507.0" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="517.0" y="408" text-anchor="start" font-size="11" fill="#D97706" font-weight="bold">Obiezione principale</text>
<text x="517.0" y="426" text-anchor="start" font-size="12" fill="#334155">Distinguere esperienza e</text>
<text x="517.0" y="442" text-anchor="start" font-size="12" fill="#334155">resoconto resta difficile</text>
<rect x="750.5" y="96" width="229.5" height="56" rx="8" fill="#7C3AED"/>
<text x="865.25" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Ordine superiore</text>
<text x="865.25" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Rosenthal; Lau</text>
<rect x="750.5" y="160" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Idea centrale</text>
<text x="760.5" y="196" text-anchor="start" font-size="12" fill="#334155">Uno stato è cosciente se il</text>
<text x="760.5" y="212" text-anchor="start" font-size="12" fill="#334155">sistema ha una</text>
<text x="760.5" y="228" text-anchor="start" font-size="12" fill="#334155">rappresentazione di esserlo</text>
<rect x="750.5" y="242" width="229.5" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="260" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Dove</text>
<text x="760.5" y="278" text-anchor="start" font-size="12" fill="#334155">Aree prefrontali</text>
<rect x="750.5" y="308" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="326" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Che cosa prevede</text>
<text x="760.5" y="344" text-anchor="start" font-size="12" fill="#334155">Senza rappresentazione di</text>
<text x="760.5" y="360" text-anchor="start" font-size="12" fill="#334155">ordine superiore, nessuna</text>
<text x="760.5" y="376" text-anchor="start" font-size="12" fill="#334155">esperienza</text>
<rect x="750.5" y="390" width="229.5" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="760.5" y="408" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Obiezione principale</text>
<text x="760.5" y="426" text-anchor="start" font-size="12" fill="#334155">Richiede capacità che</text>
<text x="760.5" y="442" text-anchor="start" font-size="12" fill="#334155">alcuni animali e i neonati</text>
<text x="760.5" y="458" text-anchor="start" font-size="12" fill="#334155">potrebbero non avere</text>
<text x="500.0" y="494" text-anchor="middle" font-size="12" fill="#64748B">Divergono nei punti verificabili: per questo si può costruire un esperimento che le metta a confronto.</text>

</svg>
