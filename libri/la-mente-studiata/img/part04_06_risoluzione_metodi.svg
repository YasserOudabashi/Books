<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Risoluzione temporale contro risoluzione spaziale</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Nessun metodo attuale ha entrambe al massimo</text>

  <!-- axes -->
  <line x1="120" y1="440" x2="820" y2="440" stroke="#334155" stroke-width="1.5"/>
  <line x1="120" y1="440" x2="120" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="470" y="480" text-anchor="middle" font-size="13" fill="#334155">Risoluzione spaziale (scarsa → eccellente)</text>
  <text x="60" y="270" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 60 270)">Risoluzione temporale (scarsa → eccellente)</text>

  <!-- points -->
  <circle cx="220" cy="160" r="14" fill="#0284C7"/>
  <text x="220" y="140" text-anchor="middle" font-size="12" fill="#0284C7" font-weight="bold">EEG</text>
  <text x="220" y="185" text-anchor="middle" font-size="10" fill="#334155">ottima nel tempo,</text>
  <text x="220" y="198" text-anchor="middle" font-size="10" fill="#334155">scarsa nello spazio</text>

  <circle cx="680" cy="380" r="14" fill="#DC2626"/>
  <text x="680" y="360" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="bold">fMRI (BOLD)</text>
  <text x="680" y="405" text-anchor="middle" font-size="10" fill="#334155">ottima nello spazio,</text>
  <text x="680" y="418" text-anchor="middle" font-size="10" fill="#334155">scarsa nel tempo</text>

  <circle cx="420" cy="220" r="14" fill="#059669"/>
  <text x="420" y="200" text-anchor="middle" font-size="12" fill="#059669" font-weight="bold">Stimolazione (TMS)</text>
  <text x="420" y="245" text-anchor="middle" font-size="10" fill="#334155">buona in entrambe,</text>
  <text x="420" y="258" text-anchor="middle" font-size="10" fill="#334155">ma effetto indiretto</text>

  <circle cx="560" cy="300" r="14" fill="#D97706"/>
  <text x="560" y="280" text-anchor="middle" font-size="12" fill="#D97706" font-weight="bold">Lesioni</text>
  <text x="560" y="325" text-anchor="middle" font-size="10" fill="#334155">variabile, dipende</text>
  <text x="560" y="338" text-anchor="middle" font-size="10" fill="#334155">dall'estensione del danno</text>

  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#94A3B8">La scelta del metodo dipende dalla domanda: seguire un processo rapido, o localizzarlo con precisione.</text>
</svg>
