<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">L'illusione della mano di gomma</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Carezze sincronizzate su mano reale (nascosta) e mano di gomma (visibile)</text>

  <!-- screen -->
  <rect x="380" y="110" width="20" height="220" fill="#94A3B8"/>
  <text x="390" y="105" text-anchor="middle" font-size="10" fill="#64748B">schermo</text>

  <!-- real hand hidden -->
  <rect x="180" y="180" width="180" height="80" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="270" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Mano reale</text>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#475569">nascosta alla vista</text>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#475569">riceve la carezza reale</text>

  <!-- rubber hand visible -->
  <rect x="420" y="180" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="510" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Mano di gomma</text>
  <text x="510" y="228" text-anchor="middle" font-size="11" fill="#1E40AF">visibile al partecipante</text>
  <text x="510" y="246" text-anchor="middle" font-size="11" fill="#1E40AF">carezza sincronizzata visibile</text>

  <!-- brush icons as lines -->
  <line x1="230" y1="180" x2="250" y2="150" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="180" x2="490" y2="150" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#92400E">stesso ritmo, stessa direzione</text>

  <!-- outcome box -->
  <rect x="230" y="310" width="440" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Dopo alcuni minuti di carezze sincronizzate:</text>
  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#166534">la mano di gomma viene percepita come parte del proprio corpo</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#166534">una minaccia alla mano di gomma provoca una reazione di allarme misurabile</text>
  <text x="450" y="396" text-anchor="middle" font-size="10" fill="#166534">(l'effetto non compare con carezze asincrone tra le due mani)</text>
</svg>
