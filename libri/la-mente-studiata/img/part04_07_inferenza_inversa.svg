<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il problema dell'inferenza inversa</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">L'amigdala si attiva per molti processi diversi, non solo per la paura</text>

  <!-- amygdala center -->
  <circle cx="450" cy="240" r="70" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="450" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">Amigdala</text>
  <text x="450" y="255" text-anchor="middle" font-size="11" fill="#7F1D1D">attivata</text>

  <!-- radiating associated processes -->
  <g font-size="11" fill="#334155">
    <line x1="450" y1="170" x2="450" y2="90" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="450" y="80" text-anchor="middle">Paura</text>

    <line x1="500" y1="195" x2="650" y2="110" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="660" y="105" text-anchor="start">Valenza positiva</text>

    <line x1="510" y1="240" x2="720" y2="240" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="730" y="245" text-anchor="start">Valenza negativa</text>

    <line x1="500" y1="285" x2="650" y2="370" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="660" y="385" text-anchor="start">Affidabilità del volto</text>

    <line x1="450" y1="310" x2="450" y2="400" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="450" y="420" text-anchor="middle">Disgusto</text>

    <line x1="400" y1="285" x2="250" y2="370" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="240" y="385" text-anchor="end">Novità / salienza</text>

    <line x1="390" y1="240" x2="180" y2="240" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="170" y="245" text-anchor="end">Volti emotivi (in genere)</text>

    <line x1="400" y1="195" x2="250" y2="110" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="240" y="105" text-anchor="end">Disgusto facciale</text>
  </g>

  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="bold">Concludere "amigdala attiva = paura" ignora tutte le altre associazioni possibili.</text>
</svg>
