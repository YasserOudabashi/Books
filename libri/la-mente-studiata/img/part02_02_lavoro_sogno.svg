<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Dal contenuto latente al contenuto manifesto</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">I quattro meccanismi del lavoro del sogno</text>

  <!-- latent box -->
  <rect x="60" y="90" width="200" height="70" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Contenuto latente</text>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="#475569">pensieri, desideri,</text>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#475569">ricordi del giorno</text>

  <!-- arrow -->
  <line x1="270" y1="125" x2="330" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 mechanisms stacked -->
  <g>
    <rect x="330" y="80" width="240" height="55" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="450" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">1. Condensazione</text>
    <text x="450" y="120" text-anchor="middle" font-size="10" fill="#78350F">più pensieri → un solo elemento</text>

    <rect x="330" y="145" width="240" height="55" rx="6" fill="#FDF4FF" stroke="#A21CAF" stroke-width="1.5"/>
    <text x="450" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#701A75">2. Spostamento</text>
    <text x="450" y="185" text-anchor="middle" font-size="10" fill="#581C87">peso emotivo su un elemento marginale</text>

    <rect x="330" y="210" width="240" height="55" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="450" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">3. Drammatizzazione</text>
    <text x="450" y="250" text-anchor="middle" font-size="10" fill="#064E3B">pensieri astratti → scene visive</text>

    <rect x="330" y="275" width="240" height="55" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="450" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">4. Elaborazione secondaria</text>
    <text x="450" y="315" text-anchor="middle" font-size="10" fill="#1E40AF">coerenza di superficie ("facciata")</text>
  </g>

  <!-- censorship barrier -->
  <line x1="605" y1="75" x2="605" y2="345" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="605" y="365" text-anchor="middle" font-size="11" fill="#DC2626">censura</text>
  <text x="605" y="380" text-anchor="middle" font-size="10" fill="#DC2626">(si allenta, non scompare)</text>

  <!-- arrow to manifest -->
  <line x1="570" y1="205" x2="650" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- manifest box -->
  <rect x="650" y="170" width="200" height="70" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="750" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Contenuto manifesto</text>
  <text x="750" y="218" text-anchor="middle" font-size="11" fill="#475569">il sogno come</text>
  <text x="750" y="233" text-anchor="middle" font-size="11" fill="#475569">ricordato al risveglio</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="450" y="400" text-anchor="middle" font-size="13" fill="#334155">Il risultato è sempre un compromesso: travestito abbastanza da superare la censura,</text>
  <text x="450" y="420" text-anchor="middle" font-size="13" fill="#334155">intatto abbastanza da soddisfare, in parte, la spinta del contenuto latente.</text>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#94A3B8">Se il travestimento fallisce: sogno d'angoscia (il compromesso non regge).</text>
</svg>
