<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">I quattro quadranti del condizionamento operante</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Positivo/negativo = aggiunta/rimozione; non "buono/cattivo"</text>

  <!-- column/row headers -->
  <text x="290" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Il comportamento AUMENTA</text>
  <text x="650" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Il comportamento DIMINUISCE</text>
  <text x="90" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 90 180)">Si AGGIUNGE (positivo)</text>
  <text x="90" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 90 360)">Si RIMUOVE (negativo)</text>

  <!-- quadrant 1: rinforzo positivo -->
  <rect x="130" y="115" width="320" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Rinforzo positivo</text>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#064E3B">Si aggiunge qualcosa di gradevole</text>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#064E3B">Es.: premio quando il cane si siede</text>

  <!-- quadrant 2: punizione positiva -->
  <rect x="490" y="115" width="320" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">Punizione positiva</text>
  <text x="650" y="170" text-anchor="middle" font-size="11" fill="#7F1D1D">Si aggiunge qualcosa di sgradevole</text>
  <text x="650" y="190" text-anchor="middle" font-size="11" fill="#7F1D1D">Es.: scossa lieve quando il cane abbaia</text>

  <!-- quadrant 3: rinforzo negativo -->
  <rect x="130" y="290" width="320" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="290" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Rinforzo negativo</text>
  <text x="290" y="345" text-anchor="middle" font-size="11" fill="#064E3B">Si rimuove qualcosa di sgradevole</text>
  <text x="290" y="365" text-anchor="middle" font-size="11" fill="#064E3B">Es.: l'allarme smette quando ci si allaccia</text>

  <!-- quadrant 4: punizione negativa -->
  <rect x="490" y="290" width="320" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">Punizione negativa</text>
  <text x="650" y="345" text-anchor="middle" font-size="11" fill="#7F1D1D">Si rimuove qualcosa di gradevole</text>
  <text x="650" y="365" text-anchor="middle" font-size="11" fill="#7F1D1D">Es.: si toglie il telefono</text>

  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#94A3B8">Rinforzo e punizione sono definiti dall'effetto osservato, mai dall'intenzione.</text>
</svg>
