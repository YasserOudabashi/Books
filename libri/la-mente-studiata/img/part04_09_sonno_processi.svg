<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il modello a due processi del sonno</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">La spinta a dormire nasce dall'incontro di due curve indipendenti</text>

  <!-- axes -->
  <line x1="100" y1="420" x2="820" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="100" y1="420" x2="100" y2="90" stroke="#334155" stroke-width="1.5"/>
  <text x="460" y="460" text-anchor="middle" font-size="13" fill="#334155">Ore del giorno</text>
  <text x="70" y="49" font-size="0"> </text>

  <!-- time labels -->
  <g font-size="11" fill="#64748B">
    <text x="100" y="440" text-anchor="middle">8:00</text>
    <text x="280" y="440" text-anchor="middle">14:00</text>
    <text x="460" y="440" text-anchor="middle">20:00</text>
    <text x="640" y="440" text-anchor="middle">2:00</text>
    <text x="820" y="440" text-anchor="middle">8:00</text>
  </g>

  <!-- Process S: homeostatic pressure, rises while awake, falls while asleep -->
  <path d="M 100,380 C 250,340 350,260 550,150 C 600,130 620,125 640,120"
        fill="none" stroke="#DC2626" stroke-width="3"/>
  <path d="M 640,120 C 700,220 760,320 820,380" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="2,0"/>
  <text x="670" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">Processo S (pressione omeostatica)</text>

  <!-- Process C: circadian, sinusoidal, independent of prior sleep -->
  <path d="M 100,300 C 180,220 260,190 340,200 C 420,210 460,260 500,320
           C 540,370 600,395 660,380 C 720,365 780,300 820,240"
        fill="none" stroke="#0284C7" stroke-width="3"/>
  <text x="230" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284C7">Processo C (ritmo circadiano)</text>

  <!-- sleep window marker -->
  <rect x="640" y="90" width="180" height="330" fill="#EEF2FF" opacity="0.5"/>
  <text x="730" y="405" text-anchor="middle" font-size="11" fill="#3730A3">finestra di sonno</text>

  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#334155">Il sonno arriva quando la pressione omeostatica (S) è alta e il segnale di veglia circadiano (C) è basso: i due processi devono coincidere.</text>
</svg>
