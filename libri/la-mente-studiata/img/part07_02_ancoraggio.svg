<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">L'esperimento della ruota della fortuna</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Un numero arbitrario sposta la stima di un compito non collegato</text>

  <circle cx="230" cy="200" r="90" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <line x1="230" y1="110" x2="230" y2="290" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="140" y1="200" x2="320" y2="200" stroke="#CBD5E1" stroke-width="1"/>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="#334155">ruota</text>
  <text x="230" y="170" text-anchor="middle" font-size="12" fill="#334155">truccata</text>
  <text x="230" y="240" text-anchor="middle" font-size="12" fill="#334155">(10 o 65</text>
  <text x="230" y="258" text-anchor="middle" font-size="12" fill="#334155">soltanto)</text>

  <path d="M 340,200 L 420,200" stroke="#94A3B8" stroke-width="2" marker-end="url(#arra)"/>
  <defs><marker id="arra" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker></defs>

  <rect x="430" y="110" width="200" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="530" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Ruota ferma su 10</text>
  <text x="530" y="160" text-anchor="middle" font-size="11" fill="#1E40AF">stima media: ~25%</text>
  <text x="530" y="178" text-anchor="middle" font-size="10" fill="#1E40AF">di paesi africani nell'ONU</text>

  <rect x="430" y="210" width="200" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="530" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">Ruota ferma su 65</text>
  <text x="530" y="260" text-anchor="middle" font-size="11" fill="#991B1B">stima media: ~45%</text>
  <text x="530" y="278" text-anchor="middle" font-size="10" fill="#991B1B">di paesi africani nell'ONU</text>

  <rect x="670" y="150" width="180" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="760" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Il numero della ruota</text>
  <text x="760" y="200" text-anchor="middle" font-size="11" fill="#92400E">non ha alcuna relazione</text>
  <text x="760" y="220" text-anchor="middle" font-size="11" fill="#92400E">logica con la domanda —</text>
  <text x="760" y="240" text-anchor="middle" font-size="11" fill="#92400E">eppure la sposta</text>

  <rect x="150" y="360" width="600" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">L'ancora arbitraria sposta la stima finale</text>
  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#334155">anche quando i partecipanti sanno che è generata a caso</text>
</svg>
