<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Struttura di un esperimento controllato</text>

  <!-- Pool -->
  <rect x="360" y="60" width="180" height="60" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="16" fill="#334155">40 partecipanti</text>

  <!-- Arrow down to randomization -->
  <line x1="450" y1="120" x2="450" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="160" width="200" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="450" y="190" text-anchor="middle" font-size="15" fill="#334155">Randomizzazione</text>

  <!-- Two branches -->
  <line x1="450" y1="210" x2="230" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="210" x2="670" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Group A: experimental -->
  <rect x="120" y="260" width="220" height="70" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="230" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284C7">Gruppo sperimentale</text>
  <text x="230" y="310" text-anchor="middle" font-size="13" fill="#334155">Bevanda con caffeina (VI)</text>

  <!-- Group B: control -->
  <rect x="560" y="260" width="220" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="670" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">Gruppo di controllo</text>
  <text x="670" y="310" text-anchor="middle" font-size="13" fill="#334155">Bevanda placebo</text>

  <!-- Blind layer -->
  <rect x="120" y="350" width="660" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="375" text-anchor="middle" font-size="13" fill="#334155">Cecità doppia: né partecipanti né chi misura sa chi ha ricevuto cosa</text>

  <!-- Arrows to measure -->
  <line x1="230" y1="330" x2="230" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="670" y1="330" x2="670" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="390" x2="450" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Measure -->
  <rect x="300" y="420" width="300" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">Misura della VD</text>
  <text x="450" y="468" text-anchor="middle" font-size="13" fill="#334155">Parole ricordate dopo un'ora</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
