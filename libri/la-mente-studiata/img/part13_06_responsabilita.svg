<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="382" fill="#FFFFFF"/>
<text x="500.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Tre risposte sulla responsabilità</text>
<text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Esposte come le sosterrebbe chi le difende; i dati non scelgono tra loro</text><rect x="20.0" y="96" width="310.6666666666667" height="56" rx="8" fill="#0284C7"/>
<text x="175.33333333333334" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Sensibilità a ragioni</text>
<text x="175.33333333333334" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Compatibilismo; Strawson</text>
<rect x="20.0" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="178" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Su che cosa si fonda</text>
<text x="30.0" y="196" text-anchor="start" font-size="12" fill="#334155">Sulla capacità di agire per ragioni e</text>
<text x="30.0" y="212" text-anchor="start" font-size="12" fill="#334155">di cambiare in base a esse</text>
<rect x="20.0" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="244" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Scopo della risposta</text>
<text x="30.0" y="262" text-anchor="start" font-size="12" fill="#334155">Attribuire merito e colpa come pratica</text>
<text x="30.0" y="278" text-anchor="start" font-size="12" fill="#334155">tra persone</text>
<rect x="20.0" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="30.0" y="310" text-anchor="start" font-size="11" fill="#0284C7" font-weight="bold">Obiezione principale</text>
<text x="30.0" y="328" text-anchor="start" font-size="12" fill="#334155">Perché la sensibilità a ragioni</text>
<text x="30.0" y="344" text-anchor="start" font-size="12" fill="#334155">basterebbe per la colpa piena?</text>
<rect x="344.6666666666667" y="96" width="310.6666666666667" height="56" rx="8" fill="#059669"/>
<text x="500.0" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Conseguenze</text>
<text x="500.0" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Consequenzialismo</text>
<rect x="344.6666666666667" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="178" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Su che cosa si fonda</text>
<text x="354.6666666666667" y="196" text-anchor="start" font-size="12" fill="#334155">Sugli effetti della sanzione:</text>
<text x="354.6666666666667" y="212" text-anchor="start" font-size="12" fill="#334155">deterrenza, protezione, riabilitazione</text>
<rect x="344.6666666666667" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="244" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Scopo della risposta</text>
<text x="354.6666666666667" y="262" text-anchor="start" font-size="12" fill="#334155">Ridurre il danno futuro con gli</text>
<text x="354.6666666666667" y="278" text-anchor="start" font-size="12" fill="#334155">strumenti più efficaci</text>
<rect x="344.6666666666667" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="354.6666666666667" y="310" text-anchor="start" font-size="11" fill="#059669" font-weight="bold">Obiezione principale</text>
<text x="354.6666666666667" y="328" text-anchor="start" font-size="12" fill="#334155">Potrebbe giustificare di punire un</text>
<text x="354.6666666666667" y="344" text-anchor="start" font-size="12" fill="#334155">innocente se utile</text>
<rect x="669.3333333333334" y="96" width="310.6666666666667" height="56" rx="8" fill="#7C3AED"/>
<text x="824.6666666666667" y="121" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Senza colpa retributiva</text>
<text x="824.6666666666667" y="140" text-anchor="middle" font-size="11" fill="#FFFFFF">Pereboom; Caruso; Sapolsky</text>
<rect x="669.3333333333334" y="160" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="178" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Su che cosa si fonda</text>
<text x="679.3333333333334" y="196" text-anchor="start" font-size="12" fill="#334155">Sul fatto che nessuno è fonte ultima</text>
<text x="679.3333333333334" y="212" text-anchor="start" font-size="12" fill="#334155">delle proprie azioni</text>
<rect x="669.3333333333334" y="226" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="244" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Scopo della risposta</text>
<text x="679.3333333333334" y="262" text-anchor="start" font-size="12" fill="#334155">Proteggere gli altri, con il minimo di</text>
<text x="679.3333333333334" y="278" text-anchor="start" font-size="12" fill="#334155">sofferenza, e agire sulle cause</text>
<rect x="669.3333333333334" y="292" width="310.6666666666667" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.3333333333334" y="310" text-anchor="start" font-size="11" fill="#7C3AED" font-weight="bold">Obiezione principale</text>
<text x="679.3333333333334" y="328" text-anchor="start" font-size="12" fill="#334155">Rischia di trattare le persone come</text>
<text x="679.3333333333334" y="344" text-anchor="start" font-size="12" fill="#334155">oggetti da gestire</text>

</svg>
