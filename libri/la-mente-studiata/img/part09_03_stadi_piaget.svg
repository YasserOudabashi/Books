<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il modello a stadi di Piaget</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Quattro stadi e i compiti con cui furono descritti</text>

  <rect x="40" y="100" width="190" height="290" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="135" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Senso-motorio</text>
  <text x="135" y="152" text-anchor="middle" font-size="12" fill="#334155">0-2 anni</text>
  <text x="135" y="196" text-anchor="middle" font-size="12" fill="#334155">conosce il mondo</text>
  <text x="135" y="214" text-anchor="middle" font-size="12" fill="#334155">con azione e</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#334155">percezione</text>
  <text x="135" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">compito:</text>
  <text x="135" y="314" text-anchor="middle" font-size="12" fill="#334155">errore A-non-B</text>

  <rect x="255" y="100" width="190" height="290" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">Preoperatorio</text>
  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#334155">2-7 anni</text>
  <text x="350" y="196" text-anchor="middle" font-size="12" fill="#334155">simboli e linguaggio,</text>
  <text x="350" y="214" text-anchor="middle" font-size="12" fill="#334155">dominato dall'</text>
  <text x="350" y="232" text-anchor="middle" font-size="12" fill="#334155">apparenza</text>
  <text x="350" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8">compiti:</text>
  <text x="350" y="314" text-anchor="middle" font-size="12" fill="#334155">conservazione,</text>
  <text x="350" y="332" text-anchor="middle" font-size="12" fill="#334155">tre montagne</text>

  <rect x="470" y="100" width="190" height="290" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="565" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Operazioni</text>
  <text x="565" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">concrete</text>
  <text x="565" y="170" text-anchor="middle" font-size="12" fill="#334155">7-11 anni</text>
  <text x="565" y="206" text-anchor="middle" font-size="12" fill="#334155">logica su oggetti</text>
  <text x="565" y="224" text-anchor="middle" font-size="12" fill="#334155">e situazioni</text>
  <text x="565" y="242" text-anchor="middle" font-size="12" fill="#334155">concrete</text>
  <text x="565" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">compito:</text>
  <text x="565" y="314" text-anchor="middle" font-size="12" fill="#334155">conservazione</text>
  <text x="565" y="332" text-anchor="middle" font-size="12" fill="#334155">superata</text>

  <rect x="685" y="100" width="190" height="290" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="780" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B21B6">Operazioni</text>
  <text x="780" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B21B6">formali</text>
  <text x="780" y="170" text-anchor="middle" font-size="12" fill="#334155">11 anni in poi</text>
  <text x="780" y="206" text-anchor="middle" font-size="12" fill="#334155">ragionamento su</text>
  <text x="780" y="224" text-anchor="middle" font-size="12" fill="#334155">ipotesi e possibilità</text>
  <text x="780" y="242" text-anchor="middle" font-size="12" fill="#334155">astratte</text>

  <path d="M 232,245 L 253,245" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 447,245 L 468,245" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 662,245 L 683,245" stroke="#64748B" stroke-width="2" fill="none"/>

  <rect x="100" y="420" width="700" height="52" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="442" text-anchor="middle" font-size="12" fill="#92400E">Le età sono orientative. Le revisioni successive mostrano passaggi graduali,</text>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#92400E">che dipendono dal compito usato per misurarli.</text>
</svg>
