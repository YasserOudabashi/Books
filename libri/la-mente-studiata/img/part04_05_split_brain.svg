<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">L'esperimento "cervello diviso"</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Uno stimolo mostrato a un solo campo visivo raggiunge un solo emisfero</text>

  <!-- brain outline split -->
  <ellipse cx="450" cy="220" rx="220" ry="130" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="95" x2="450" y2="345" stroke="#DC2626" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="468" y="225" text-anchor="middle" font-size="10" fill="#DC2626" transform="rotate(-90 468 225)">corpo calloso sezionato</text>

  <text x="330" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Emisfero sinistro</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#1E40AF">(verbale)</text>
  <text x="330" y="230" text-anchor="middle" font-size="12" fill="#334155">riceve: campo visivo destro</text>

  <text x="570" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">Emisfero destro</text>
  <text x="570" y="200" text-anchor="middle" font-size="11" fill="#166534">(non verbale)</text>
  <text x="570" y="230" text-anchor="middle" font-size="12" fill="#334155">riceve: campo visivo sinistro</text>

  <!-- outcomes -->
  <rect x="180" y="270" width="300" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="330" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">Può nominare a voce</text>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#1E40AF">l'oggetto visto</text>
  <text x="330" y="335" text-anchor="middle" font-size="11" fill="#1E40AF">("è una mela")</text>

  <rect x="480" y="270" width="300" height="90" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="630" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532D">Nega di aver visto nulla,</text>
  <text x="630" y="315" text-anchor="middle" font-size="11" fill="#166534">ma la mano sinistra sceglie</text>
  <text x="630" y="335" text-anchor="middle" font-size="11" fill="#166534">correttamente l'oggetto a tastoni</text>

  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#334155">Il resoconto verbale riflette solo ciò a cui l'emisfero del linguaggio ha accesso —</text>
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#334155">non è una finestra neutra su "tutto ciò che il cervello sa".</text>
</svg>
