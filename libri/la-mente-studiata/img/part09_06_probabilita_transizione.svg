  <rect x="415" y="150" width="70" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="495" y="150" width="70" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="575" y="150" width="70" height="40" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <rect x="655" y="150" width="70" height="40" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
