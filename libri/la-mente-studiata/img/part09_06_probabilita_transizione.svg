  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Il flusso di sillabe e le probabilità di transizione</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748B">Nessuna pausa nel flusso: l'unico indizio sui confini è statistico</text>

