  <text x="210" y="232" text-anchor="middle" font-size="12" fill="#334155">parola 1</text>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#334155">parola 2</text>
  <text x="690" y="232" text-anchor="middle" font-size="12" fill="#334155">parola 3</text>

  <rect x="90" y="285" width="720" height="110" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="315" text-anchor="middle" font-size="13" fill="#334155">Dentro la parola, la sillaba successiva è sempre la stessa: probabilità 1,0.</text>
  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#334155">Al confine tra parole, le sillabe possibili sono tre: probabilità circa 0,33 ciascuna.</text>
  <text x="450" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Un calo della probabilità segnala un confine di parola.</text>
