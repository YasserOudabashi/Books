  <text x="130" y="176" text-anchor="middle" font-size="16" fill="#334155">bi</text>
  <text x="210" y="176" text-anchor="middle" font-size="16" fill="#334155">da</text>
  <text x="290" y="176" text-anchor="middle" font-size="16" fill="#334155">ku</text>
  <text x="370" y="176" text-anchor="middle" font-size="16" fill="#334155">pa</text>
  <text x="450" y="176" text-anchor="middle" font-size="16" fill="#334155">do</text>
  <text x="530" y="176" text-anchor="middle" font-size="16" fill="#334155">ti</text>
  <text x="610" y="176" text-anchor="middle" font-size="16" fill="#334155">go</text>
  <text x="690" y="176" text-anchor="middle" font-size="16" fill="#334155">la</text>
  <text x="770" y="176" text-anchor="middle" font-size="16" fill="#334155">bu</text>

  <path d="M 140,142 C 150,112 190,112 200,142" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="170" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">1,0</text>
  <path d="M 300,142 C 310,112 350,112 360,142" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#B91C1C">0,33</text>

  <line x1="95" y1="210" x2="325" y2="210" stroke="#059669" stroke-width="3"/>
  <line x1="335" y1="210" x2="565" y2="210" stroke="#2563EB" stroke-width="3"/>
