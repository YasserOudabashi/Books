<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="450.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Autismo: prevalenza documentata a otto anni</text>
<text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#64748B">Rete di sorveglianza statunitense: casi ogni 1.000 bambini (alcune comunità, non una stima nazionale)</text><line x1="150" y1="400" x2="710" y2="400" stroke="#334155" stroke-width="2"/><line x1="150" y1="400" x2="150" y2="130" stroke="#334155" stroke-width="2"/>
<text x="140" y="404.0" text-anchor="end" font-size="11" fill="#334155">0</text>
<line x1="150" y1="400.0" x2="710" y2="400.0" stroke="#E2E8F0"/>
<text x="140" y="336.5" text-anchor="end" font-size="11" fill="#334155">10</text>
<line x1="150" y1="332.5" x2="710" y2="332.5" stroke="#E2E8F0"/>
<text x="140" y="269.0" text-anchor="end" font-size="11" fill="#334155">20</text>
<line x1="150" y1="265.0" x2="710" y2="265.0" stroke="#E2E8F0"/>
<text x="140" y="201.5" text-anchor="end" font-size="11" fill="#334155">30</text>
<line x1="150" y1="197.5" x2="710" y2="197.5" stroke="#E2E8F0"/>
<text x="140" y="134.0" text-anchor="end" font-size="11" fill="#334155">40</text>
<line x1="150" y1="130.0" x2="710" y2="130.0" stroke="#E2E8F0"/>
<rect x="196.66666666666666" y="354.775" width="93.33333333333333" height="45.225" fill="#0284C7"/><text x="243.33333333333331" y="346.775" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">6,7</text>
<text x="243.33333333333331" y="420" text-anchor="middle" font-size="12" fill="#334155">Anno di rilevazione 2000</text>
<text x="243.33333333333331" y="438" text-anchor="middle" font-size="12" fill="#64748B">(uno su 150)</text>
<rect x="383.3333333333333" y="212.35" width="93.33333333333333" height="187.65" fill="#0284C7"/><text x="430.0" y="204.35" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">circa 28</text>
<text x="430.0" y="420" text-anchor="middle" font-size="12" fill="#334155">Anno di rilevazione 2020</text>
<text x="430.0" y="438" text-anchor="middle" font-size="12" fill="#64748B">(uno su 36)</text>
<rect x="570.0" y="182.64999999999998" width="93.33333333333333" height="217.35000000000002" fill="#0284C7"/><text x="616.6666666666666" y="174.64999999999998" text-anchor="middle" font-size="15" fill="#334155" font-weight="bold">32,2</text>
<text x="616.6666666666666" y="420" text-anchor="middle" font-size="12" fill="#334155">Anno di rilevazione 2022</text>
<text x="616.6666666666666" y="438" text-anchor="middle" font-size="12" fill="#64748B">(uno su 31)</text>
<text x="450.0" y="474" text-anchor="middle" font-size="12" fill="#334155">Da 6,7 a 32,2 per 1.000: circa 4,8 volte. Casi documentati, non incidenza: cambiano definizioni, riconoscimento e accesso ai servizi.</text>
<text x="450.0" y="496" text-anchor="middle" font-size="11" fill="#64748B">Fonte: sorveglianza dei Centri statunitensi per il controllo delle malattie (ADDM).</text>

