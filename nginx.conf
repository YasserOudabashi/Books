# Configurazione nginx del container books: sito statico, nessun backend.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # Compressione: HTML e' sempre compresso da nginx, qui aggiungiamo gli altri.
    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript image/svg+xml application/json;

    # Niente elenco automatico delle cartelle: senza index.html -> 404.
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Immagini e font: cambiano insieme al libro, si possono cachare a lungo.
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML/CSS/JS: cache breve, cosi' un nuovo deploy si vede subito.
    location ~* \.(html|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
